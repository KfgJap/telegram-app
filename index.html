<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Gearfe Casino: Final Ready</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Oswald:wght@500;700&display=swap');
        
        :root { --bg: #030712; --surface: #0f172a; --text: #f8fafc; --hint: #64748b; --primary: #0ea5e9; --money: #10b981; --gold: #f59e0b; --error: #ef4444; --radius: 20px; }
        body.theme-winter { --bg: #030712; --surface: #0f172a; --primary: #0ea5e9; --money: #10b981; --radius: 4px; }
        body.theme-summer { --bg: #0b1a05; --surface: #142e0d; --primary: #22c55e; --money: #fde047; --radius: 24px; }
        body.theme-autumn { --bg: #0a0502; --surface: #1c0a02; --primary: #f97316; --money: #eab308; --radius: 16px; }
        body.theme-spring { --bg: #02140a; --surface: #0a2e18; --primary: #34d399; --money: #a3e635; --radius: 30px; }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; transition: background 0.5s; }
        
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: var(--surface); z-index: 10; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .balance-box { display: flex; flex-direction: column; }
        .balance-label { font-size: 10px; color: var(--hint); text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }
        .balance { font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 900; color: var(--money); transition: 0.3s; }
        .admin-btn { display: none; background: transparent; border: none; font-size: 24px; cursor: pointer; color: var(--gold); }

        .main-content { flex: 1; position: relative; overflow-y: auto; padding-bottom: 90px; z-index: 5; }
        .screen { display: none; flex-direction: column; padding: 15px; }
        .screen.active { display: flex; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        h2 { font-family: 'Oswald', sans-serif; font-size: 22px; text-transform: uppercase; text-align: center; margin: 10px 0 15px 0; }

        .btn { padding: 14px; font-size: 15px; cursor: pointer; width: 100%; background: linear-gradient(180deg, var(--primary), #0284c7); color: #fff; border: none; border-radius: var(--radius); font-weight: 900; text-transform: uppercase; margin-top: 10px; display: flex; justify-content: center; align-items: center; transition: 0.1s; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .btn-gold { background: linear-gradient(180deg, var(--gold), #d97706); color: #000; }
        .btn-sm { padding: 10px; font-size: 12px; margin-top: 5px; }

        /* Ставки */
        .bet-section { background: var(--surface); padding: 12px; border-radius: var(--radius); margin-bottom: 15px; position: relative; z-index: 20; }
        .bet-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 12px; color: var(--hint); font-weight: 800; text-transform: uppercase; }
        .bet-controls { display: flex; align-items: center; justify-content: space-between; background: #000; border-radius: 12px; padding: 5px; border: 1px solid rgba(255,255,255,0.1); }
        .bet-btn { width: 40px; height: 40px; background: rgba(255,255,255,0.1); border: none; border-radius: 8px; color: #fff; font-size: 20px; font-weight: 900; cursor: pointer; }
        .bet-btn:active { background: rgba(255,255,255,0.2); }
        .bet-input { flex: 1; background: transparent; border: none; color: #fff; font-size: 24px; font-weight: 900; text-align: center; outline: none; }
        
        .quick-bet-toggle { width: 100%; background: rgba(255,255,255,0.05); border: none; color: var(--primary); padding: 10px; border-radius: 8px; margin-top: 10px; font-weight: 900; font-size: 12px; display: flex; justify-content: center; align-items: center; gap: 5px; cursor: pointer; }
        .quick-bet-toggle:active { background: rgba(255,255,255,0.1); }
        
        .quick-bet-panel { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: #000; border-radius: 8px; margin-top: 5px; }
        .quick-bet-panel.open { max-height: 200px; }
        .quick-bet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 10px; }
        .quick-bet-btn { background: var(--surface); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px 5px; border-radius: 8px; font-weight: 900; font-size: 14px; cursor: pointer; }
        .quick-bet-btn:active { background: var(--primary); color: #000; }
        .quick-bet-bottom { display: flex; justify-content: space-between; padding: 0 10px 10px 10px; }
        .quick-bet-control { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 40px; height: 30px; border-radius: 6px; font-weight: 900; cursor: pointer; }

        /* Рулетка */
        .roulette-container { width: 100%; height: 100px; background: #000; border-radius: var(--radius); position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px; }
        .roulette-strip { display: flex; height: 100%; align-items: center; }
        .pointer { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; background: #fff; transform: translateX(-50%); z-index: 10; box-shadow: 0 0 10px #fff; }
        .result-text { text-align: center; font-weight: 900; height: 30px; margin-top: 10px; color: var(--primary); font-size: 18px; }

        /* Кости, Слоты, Монетка */
        .dice-area { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
        .dice { width: 70px; height: 70px; background: #fff; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 35px; color: #000; font-weight: 900; }
        .slots-area { display: flex; justify-content: center; gap: 10px; background: var(--surface); padding: 20px; border-radius: var(--radius); margin: 20px 0; }
        .slot { width: 60px; height: 80px; background: #000; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 35px; }
        .coin-container { display: flex; flex-direction: column; align-items: center; margin: 15px 0; }
        .coin { width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, #fbbf24, #d97706); display: flex; justify-content: center; align-items: center; font-size: 45px; font-weight: 900; color: #000; border: 4px solid #fff; transition: transform 2s ease-out; margin-bottom: 15px; }
        .coin.spinning { animation: spinCoin 2s ease-out forwards; }
        @keyframes spinCoin { 0% { transform: rotateY(0); } 100% { transform: rotateY(3600deg); } }
        .coin-choice { display: flex; gap: 10px; }
        .choice-btn { padding: 10px 20px; border-radius: var(--radius); border: 2px solid var(--primary); background: var(--surface); color: #fff; font-weight: 900; cursor: pointer; }
        .choice-btn.active { background: var(--primary); color: #000; }

        /* Каталог */
        .games-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .game-card { background: var(--surface); border-radius: var(--radius); height: 110px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: 900; font-size: 13px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
        .game-card .icon { font-size: 35px; margin-bottom: 5px; }

        /* Профиль */
        .profile-card { display: flex; flex-direction: column; align-items: center; background: var(--surface); padding: 20px; border-radius: var(--radius); width: 100%; margin-bottom: 15px; }
        .avatar-container { position: relative; cursor: pointer; margin-bottom: 10px; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--primary); display: flex; justify-content: center; align-items: center; font-size: 30px; font-weight: 900; background-size: cover; background-position: center; }
        .user-name { font-size: 20px; font-weight: 900; }
        .user-username { font-size: 12px; color: var(--hint); }
        .user-title { font-size: 14px; color: var(--hint); font-weight: 800; margin-top: 5px; }
        .auth-buttons { display: flex; gap: 10px; width: 100%; margin-top: 15px; }
        .promo-box { background: var(--surface); padding: 15px; border-radius: var(--radius); display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .promo-input { background: #000; border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; color: #fff; text-align: center; font-weight: 800; outline: none; font-size: 16px; text-transform: uppercase; }
        .theme-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .theme-btn { padding: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; text-align: center; font-size: 12px; font-weight: 800; cursor: pointer; border: 1px solid transparent; }

        /* Нижнее меню */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--surface); display: flex; justify-content: space-around; padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); border-top: 1px solid rgba(255,255,255,0.1); z-index: 100; }
        .nav-btn { background: transparent; border: none; color: var(--hint); font-weight: 800; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; padding: 10px; border-radius: 10px; width: 80px; transition: 0.2s; }
        .nav-btn.active { color: var(--primary); background: rgba(255,255,255,0.05); }

        /* Модалки и Тосты */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: flex-end; backdrop-filter: blur(5px); }
        .slide-panel { background: var(--surface); width: 100%; max-width: 500px; border-radius: 24px 24px 0 0; padding: 20px; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--surface); color: #fff; padding: 10px 20px; border-radius: 30px; font-weight: 800; font-size: 14px; z-index: 3000; opacity: 0; transition: 0.3s; pointer-events: none; box-shadow: 0 5px 20px rgba(0,0,0,0.5); border: 1px solid var(--primary); }
        .toast.show { opacity: 1; top: 40px; }
    </style>
</head>
<body id="body-theme" class="theme-winter">

    <header class="header">
        <div class="balance-box">
            <span class="balance-label">Баланс</span>
            <span class="balance" id="balance">1000</span>
        </div>
        <button id="admin-btn" class="admin-btn" onclick="openAdmin()">▶️</button>
    </header>

    <main class="main-content">
        <!-- ИГРА -->
        <section id="screen-play" class="screen active">
            <h2 id="game-title">Рулетка</h2>
            
            <!-- Блок ставок -->
            <div class="bet-section" id="bet-container">
                <div class="bet-header"><span>Ваша ставка</span></div>
                <div class="bet-controls">
                    <button class="bet-btn" onclick="changeBet(-50)">-</button>
                    <input type="number" class="bet-input" id="bet-input" value="10" min="10">
                    <button class="bet-btn" onclick="changeBet(50)">+</button>
                </div>
                <button class="quick-bet-toggle" onclick="toggleQuickBet()">⬇️ Быстрые ставки</button>
                <div class="quick-bet-panel" id="quick-bet-panel">
                    <div class="quick-bet-grid" id="quick-bet-grid"></div>
                    <div class="quick-bet-bottom">
                        <button class="quick-bet-control" onclick="changeQuickStep(-100)">-</button>
                        <button class="quick-bet-control" onclick="changeQuickStep(100)">+</button>
                    </div>
                </div>
            </div>

            <div id="view-roulette">
                <div class="roulette-container"><div class="pointer"></div><div class="roulette-strip" id="strip"></div></div>
                <p id="roulette-result" class="result-text"></p>
                <button class="btn" id="spin-btn">Крутить</button>
            </div>

            <div id="view-dice" style="display: none; text-align: center;">
                <div class="dice-area"><div class="dice" id="dice1">🎲</div><div class="dice" id="dice2">🎲</div></div>
                <p id="dice-result" class="result-text"></p>
                <button class="btn" id="dice-btn">Бросить (7 или 11 = x2)</button>
            </div>

            <div id="view-slots" style="display: none; text-align: center;">
                <div class="slots-area"><div class="slot" id="slot1">🍒</div><div class="slot" id="slot2">🍒</div><div class="slot" id="slot3">🍒</div></div>
                <p id="slots-result" class="result-text"></p>
                <button class="btn" id="slots-btn">Крутить (3 в ряд = x5)</button>
            </div>

            <div id="view-coin" style="display: none; text-align: center;">
                <div class="coin-choice">
                    <button class="choice-btn active" id="choice-heads" onclick="selectCoinSide('heads')">👑 Орел</button>
                    <button class="choice-btn" id="choice-tails" onclick="selectCoinSide('tails')">🦅 Решка</button>
                </div>
                <div class="coin-container"><div class="coin" id="coin">?</div></div>
                <p id="coin-result" class="result-text"></p>
                <button class="btn" id="coin-btn">Подбросить</button>
            </div>
        </section>

        <!-- КАТАЛОГ -->
        <section id="screen-games" class="screen">
            <h2>Каталог игр</h2>
            <div class="games-grid">
                <div class="game-card" onclick="selectGame('roulette', 'Рулетка')"><div class="icon">🎰</div>Рулетка</div>
                <div class="game-card" onclick="selectGame('dice', 'Кости')"><div class="icon">🎲</div>Кости</div>
                <div class="game-card" onclick="selectGame('slots', 'Слоты')"><div class="icon">🍒</div>Слоты</div>
                <div class="game-card" onclick="selectGame('coin', 'Монетка')"><div class="icon">🪙</div>Монетка</div>
            </div>
        </section>

        <!-- ПРОФИЛЬ -->
        <section id="screen-profile" class="screen">
            <h2>Профиль</h2>
            <div class="profile-card">
                <div class="avatar-container" onclick="changeAvatar()">
                    <div class="avatar" id="user-avatar">U</div>
                    <div style="position: absolute; bottom: 0; right: 0; background: var(--primary); width: 25px; height: 25px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; border: 2px solid var(--bg);">✏️</div>
                </div>
                <h3 class="user-name" id="user-name">Игрок</h3>
                <p class="user-username" id="user-username">@username</p>
                <p class="user-title" id="user-title">Титул: Новичок</p>
                
                <div class="auth-buttons">
                    <button class="btn btn-sm" onclick="showToast('Вход будет доступен позже')">Войти</button>
                    <button class="btn btn-sm btn-gold" onclick="showToast('Регистрация будет доступна позже')">Регистрация</button>
                </div>
            </div>
            
            <div class="promo-box">
                <input type="text" class="promo-input" id="promo-input" placeholder="ВВЕДИ ПРОМОКОД">
                <button class="btn" onclick="checkPromo()">Активировать</button>
            </div>

            <div class="theme-selector">
                <div class="theme-btn" onclick="changeTheme('theme-winter')">❄️ Зима</div>
                <div class="theme-btn" onclick="changeTheme('theme-summer')">☀️ Лето</div>
                <div class="theme-btn" onclick="changeTheme('theme-autumn')">🍂 Осень</div>
                <div class="theme-btn" onclick="changeTheme('theme-spring')">🌸 Весна</div>
            </div>

            <button class="btn btn-gold" style="margin-top: 20px;" onclick="claimBonus()">🎁 Ежедневный бонус</button>
        </section>
    </main>

    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('play', this)">🎮 Играть</button>
        <button class="nav-btn" onclick="switchTab('games', this)">🎲 Игры</button>
        <button class="nav-btn" onclick="switchTab('profile', this)">👤 Профиль</button>
    </nav>

    <div id="admin-modal" class="modal-overlay">
        <div class="slide-panel">
            <h3 style="color: var(--gold); text-align: center; margin-bottom: 15px;">Тест-Станция</h3>
            <button class="btn" onclick="updateBalance(10000); showToast('+10 000 ₽');">+ 10 000 ₽</button>
            <button class="btn" onclick="updateBalance(-10000); showToast('-10 000 ₽');">- 10 000 ₽</button>
            <button class="btn" style="background: var(--error); margin-top: 20px;" onclick="document.getElementById('admin-modal').style.display='none'">Закрыть</button>
        </div>
    </div>

    <div id="toast" class="toast">Уведомление</div>
    <audio id="spin-sound" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3" preload="auto"></audio>

    <script>
        Telegram.WebApp.ready(); Telegram.WebApp.expand(); Telegram.WebApp.disableVerticalSwipes();

        // --- БАЗА ---
        let balance = parseInt(localStorage.getItem('casino_balance')) || 1000;
        let isAdmin = localStorage.getItem('is_admin') === 'true';
        const balanceEl = document.getElementById('balance');
        balanceEl.innerText = balance;

        function updateBalance(amount) {
            balance += amount; if (balance < 0) balance = 0;
            localStorage.setItem('casino_balance', balance);
            balanceEl.innerText = balance;
            balanceEl.style.color = amount > 0 ? 'var(--money)' : 'var(--error)';
            setTimeout(() => balanceEl.style.color = 'var(--money)', 300);
        }

        function showToast(text) {
            const t = document.getElementById('toast');
            t.innerText = text; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        // --- НАВИГАЦИЯ ---
        function switchTab(screenId, btn = null) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + screenId).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active'); else {
                const i = screenId === 'play' ? 0 : screenId === 'games' ? 1 : 2;
                document.querySelectorAll('.nav-btn')[i].classList.add('active');
            }
        }

        function selectGame(gameId, gameName) {
            document.getElementById('game-title').innerText = gameName;
            document.querySelectorAll('[id^="view-"]').forEach(g => g.style.display = 'none');
            document.getElementById('view-' + gameId).style.display = 'block';
            document.getElementById('bet-container').style.display = (gameId === 'roulette') ? 'block' : 'none'; // Ставки только для рулетки в этом прототипе
            switchTab('play');
        }

        // --- СТАВКИ ---
        const betInput = document.getElementById('bet-input');
        let quickStep = 100;

        function changeBet(amount) {
            let val = parseInt(betInput.value) + amount;
            if (val < 10) val = 10;
            if (val > balance) val = balance;
            betInput.value = val;
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        function toggleQuickBet() {
            document.getElementById('quick-bet-panel').classList.toggle('open');
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        function renderQuickBets() {
            const grid = document.getElementById('quick-bet-grid');
            grid.innerHTML = '';
            const values = [quickStep, quickStep * 2, quickStep * 5, quickStep * 10, quickStep * 50, quickStep * 100];
            values.forEach(val => {
                const btn = document.createElement('button');
                btn.className = 'quick-bet-btn';
                btn.innerText = val;
                btn.onclick = () => {
                    betInput.value = (val > balance) ? balance : val;
                    Telegram.WebApp.HapticFeedback.impactOccurred('light');
                };
                grid.appendChild(btn);
            });
        }

        function changeQuickStep(amount) {
            quickStep += amount;
            if (quickStep < 10) quickStep = 10;
            renderQuickBets();
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        renderQuickBets();

        function placeBet() {
            const bet = parseInt(betInput.value);
            if (bet < 10) { showToast('Мин. ставка 10 ₽'); return false; }
            if (bet > balance) { showToast('Недостаточно средств!'); return false; }
            updateBalance(-bet);
            Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            return bet;
        }

        // --- ИГРЫ ---
        const strip = document.getElementById('strip');
        const rItems = [{name:'Хлам', mult:1, chance:50},{name:'Монета', mult:2, chance:25},{name:'Кристалл', mult:3, chance:15},{name:'Артефакт', mult:5, chance:8},{name:'ДЖЕКПОТ', mult:10, chance:2}];
        const ITEM_WIDTH = 108;
        
        for (let i = 0; i < 40; i++) {
            const item = rItems[i % rItems.length];
            const div = document.createElement('div');
            div.style.minWidth = '100px'; div.style.height = '100px'; div.style.display = 'flex'; div.style.justifyContent = 'center'; div.style.alignItems = 'center'; div.style.borderRight = '1px solid rgba(255,255,255,0.1)'; div.style.fontWeight = '900'; div.style.fontSize = '14px'; div.innerText = item.name;
            strip.appendChild(div);
        }
        document.getElementById('spin-btn').onclick = () => {
            const bet = placeBet(); if (!bet) return;
            document.getElementById('spin-btn').disabled = true;
            document.getElementById('spin-sound').play().catch(e => {});
            const rand = Math.random() * 100; let acc = 0, winIndex = 0;
            for(let i=0; i<rItems.length; i++) { acc += rItems[i].chance; if(rand <= acc) { winIndex = i; break; } }
            
            const loops = 5 + Math.floor(Math.random() * 2);
            const targetIndex = (loops * rItems.length) + winIndex;
            const centerOffset = (window.innerWidth / 2) - (100 / 2);
            const shift = (targetIndex * ITEM_WIDTH) - centerOffset;

            strip.style.transition = 'transform 4s cubic-bezier(0.1, 0.9, 0.2, 1)';
            strip.style.transform = `translateX(-${shift}px)`;
            
            setTimeout(() => {
                const won = rItems[winIndex]; const winAmt = bet * won.mult;
                document.getElementById('roulette-result').innerHTML = won.mult > 1 ? `<span style="color:var(--money)">${won.name} (+${winAmt} ₽)</span>` : `<span style="color:var(--error)">${won.name}</span>`;
                if (won.mult > 1) updateBalance(winAmt);
                document.getElementById('spin-btn').disabled = false;
                setTimeout(() => { strip.style.transition = 'none'; strip.style.transform = 'translateX(0)'; }, 1000);
            }, 4100);
        };

        // Кости
        document.getElementById('dice-btn').onclick = () => {
            const bet = placeBet(); if (!bet) return;
            document.getElementById('dice-btn').disabled = true;
            let count = 0;
            const interval = setInterval(() => {
                document.getElementById('dice1').innerText = Math.floor(Math.random() * 6) + 1;
                document.getElementById('dice2').innerText = Math.floor(Math.random() * 6) + 1;
                if (++count > 10) {
                    clearInterval(interval);
                    const v1 = Math.floor(Math.random() * 6) + 1, v2 = Math.floor(Math.random() * 6) + 1;
                    document.getElementById('dice1').innerText = v1; document.getElementById('dice2').innerText = v2;
                    if (v1 + v2 === 7 || v1 + v2 === 11) { updateBalance(bet * 2); document.getElementById('dice-result').innerHTML = `Сумма: ${v1+v2} <br><span style="color:var(--money)">Победа! +${bet*2} ₽</span>`; } 
                    else { document.getElementById('dice-result').innerHTML = `Сумма: ${v1+v2} <br><span style="color:var(--error)">Проигрыш</span>`; }
                    document.getElementById('dice-btn').disabled = false;
                }
            }, 100);
        };

        // Слоты
        document.getElementById('slots-btn').onclick = () => {
            const bet = placeBet(); if (!bet) return;
            document.getElementById('slots-btn').disabled = true;
            const sItems = ['🍒', '🍋', '🍉', '💎', '7️⃣'];
            let count = 0;
            const interval = setInterval(() => {
                document.getElementById('slot1').innerText = sItems[Math.floor(Math.random() * sItems.length)];
                document.getElementById('slot2').innerText = sItems[Math.floor(Math.random() * sItems.length)];
                document.getElementById('slot3').innerText = sItems[Math.floor(Math.random() * sItems.length)];
                if (++count > 10) {
                    clearInterval(interval);
                    const v1 = sItems[Math.floor(Math.random() * sItems.length)], v2 = sItems[Math.floor(Math.random() * sItems.length)], v3 = sItems[Math.floor(Math.random() * sItems.length)];
                    document.getElementById('slot1').innerText = v1; document.getElementById('slot2').innerText = v2; document.getElementById('slot3').innerText = v3;
                    if (v1 === v2 && v2 === v3) { updateBalance(bet * 5); document.getElementById('slots-result').innerHTML = `ДЖЕКПОТ! <br><span style="color:var(--money)">+${bet*5} ₽</span>`; } 
                    else { document.getElementById('slots-result').innerHTML = `<span style="color:var(--error)">Попробуй еще раз!</span>`; }
                    document.getElementById('slots-btn').disabled = false;
                }
            }, 100);
        };

        // Монетка
        let selectedCoin = 'heads', isFlipping = false;
        function selectCoinSide(side) { selectedCoin = side; document.getElementById('choice-heads').classList.toggle('active', side === 'heads'); document.getElementById('choice-tails').classList.toggle('active', side === 'tails'); }
        document.getElementById('coin-btn').onclick = () => {
            if (isFlipping) return; const bet = placeBet(); if (!bet) return; isFlipping = true;
            document.getElementById('coin-btn').disabled = true; const coin = document.getElementById('coin'); coin.classList.add('spinning');
            setTimeout(() => {
                coin.classList.remove('spinning'); const isHeads = Math.random() > 0.5; coin.innerText = isHeads ? '👑' : '🦅';
                if ((isHeads && selectedCoin === 'heads') || (!isHeads && selectedCoin === 'tails')) { updateBalance(bet * 2); document.getElementById('coin-result').innerHTML = `<span style="color:var(--money)">Угадал! +${bet*2} ₽</span>`; } 
                else { document.getElementById('coin-result').innerHTML = `<span style="color:var(--error)">Не угадал! -${bet} ₽</span>`; }
                isFlipping = false; document.getElementById('coin-btn').disabled = false;
            }, 2000);
        };

        // --- ПРОФИЛЬ ---
        const tgUser = Telegram.WebApp.initDataUnsafe?.user;
        if (tgUser) {
            document.getElementById('user-name').innerText = tgUser.first_name;
            document.getElementById('user-avatar').innerText = tgUser.first_name.charAt(0).toUpperCase();
            if (tgUser.username) document.getElementById('user-username').innerText = '@' + tgUser.username;
            if (tgUser.photo_url) {
                document.getElementById('user-avatar').style.backgroundImage = `url(${tgUser.photo_url})`;
                document.getElementById('user-avatar').innerText = '';
            }
        }
        
        function changeAvatar() {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = 'image/*';
            input.onchange = (e) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    document.getElementById('user-avatar').style.backgroundImage = `url(${event.target.result})`;
                    document.getElementById('user-avatar').innerText = '';
                    localStorage.setItem('custom_avatar', event.target.result);
                };
                reader.readAsDataURL(e.target.files[0]);
            };
            input.click();
        }
        const savedAvatar = localStorage.getItem('custom_avatar');
        if (savedAvatar) {
            document.getElementById('user-avatar').style.backgroundImage = `url(${savedAvatar})`;
            document.getElementById('user-avatar').innerText = '';
        }

        // --- ТЕМЫ И ПРОМОКОДЫ ---
        function changeTheme(themeClass) {
            document.getElementById('body-theme').className = themeClass;
            localStorage.setItem('theme', themeClass);
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
        document.getElementById('body-theme').className = localStorage.getItem('theme') || 'theme-winter';

        function checkPromo() {
            const input = document.getElementById('promo-input');
            const code = input.value.trim().toUpperCase();
            
            if (code === 'ADMIN_KFG') {
                isAdmin = true;
                localStorage.setItem('is_admin', 'true');
                document.getElementById('admin-btn').style.display = 'block';
                document.getElementById('user-title').innerText = 'Титул: Администратор';
                document.getElementById('user-title').style.color = 'var(--gold)';
                showToast('Доступ разрешен. Вы Админ!');
                input.value = '';
            } else {
                showToast('Неверный промокод');
            }
        }

        function openAdmin() {
            if (isAdmin) document.getElementById('admin-modal').style.display = 'flex';
        }
        if (isAdmin) {
            document.getElementById('admin-btn').style.display = 'block';
            document.getElementById('user-title').innerText = 'Титул: Администратор';
            document.getElementById('user-title').style.color = 'var(--gold)';
        }

        function claimBonus() {
            const lastBonus = localStorage.getItem('last_bonus');
            if (!lastBonus || Date.now() - lastBonus > 24 * 60 * 60 * 1000) {
                updateBalance(1000);
                localStorage.setItem('last_bonus', Date.now());
                showToast('Вы получили 1000 ₽!');
            } else {
                showToast('Бонус уже получен!');
            }
        }
    </script>
</body>
</html>
