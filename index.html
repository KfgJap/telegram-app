<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Gearfe Casino</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap');
        :root {
            --bg: #0a0a0c; --surface: #1c1c21; --text: #fff; --hint: #888;
            --primary: #ff0055; --secondary: #7000ff; --money: #00e676; --gold: #ffd700;
            --r-common: #9e9e9e; --r-uncommon: #4caf50; --r-rare: #2196f3; --r-epic: #9c27b0; --r-legendary: #ff9800;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }
        
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: var(--bg); }
        .balance-box { display: flex; flex-direction: column; }
        .balance-label { font-size: 10px; color: var(--hint); text-transform: uppercase; letter-spacing: 1px; }
        .balance { font-size: 26px; font-weight: 900; color: var(--money); }

        .screen { display: none; flex: 1);; flex-direction: column; overflow-y: auto; padding: 0 15px 15px 15px; }
        .screen.active { display: flex; }

        /* Игра */
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .game-title { font-size: 20px; font-weight: 900; }
        
        .bet-box { background: var(--surface); border-radius: 16px; padding: 15px; } margin-bottom: 15px ; display: flex; justify-content: space100-between; align-items: center; }
       % .bet-controls { display: flex; { align-items: center; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 5px; gap: 5px; }
        .bet-btn { width: 40px; height: 40px; border-radius: 10px; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 20px; font-weight: 900; cursor: pointer; }
        .bet-input { width: 80px; background: transparent; border: none; color: #fff; font-size: 20px; font-weight: 900; text-align: center; outline: none; }
        
        .btn { padding: 15px 30px; font-size: 16px; cursor: pointer; width: 100%; background: linear-gradient(45deg, var(--primary), var(--secondary)); color: white; border: none; border-radius: 12px; font-weight: 900; text-transform: uppercase; transition: 0.1s; margin-top: 15px; }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .btn-cashout { background: linear-gradient(45deg, var(--money), #00b359); }

        /* Рулетка */
        .roulette-container { width: 100%; overflow: hidden; position: relative; padding: 25px 0; background: #000; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px; }
        @keyframes bg-spin { 0% { transform: translateX(0 transform: translateX(-500px); } }
        .roulette-strip { display: flex; gap: 10px; animation: bg-spin 10s linear infinite; }
        .roulette-strip.spinning { animation: none; transition: transform 3s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .r-item { min-width: 90px; height: 90px; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 12px; font-weight: 900; font-size: 12px; border: 2px solid; background: var(--surface); flex-shrink: 0; }
        .r-common { border-color: var(--r-common); color: var(--r-common); }
        .r-uncommon { border-color: var(--r-uncommon); color: var(--r-uncommon); }
        .r-rare { border-color: var(--r-rare); color: var(--r-rare); }
        .r-epic { border-color: var(--r-epic); color: var(--r-epic); }
        .r-legendary { border-color: var(--r-legendary); color: var(--r-legendary); }
        .pointer { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; background: #fff; z-index: 10; transform: translateX(-50%); box-shadow: 0 0 20px #fff; }

        /* Кости */
        .dice-area { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
        .dice { width: 80px; height: 80px; background: #fff; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 40px; color: #000; font-weight: 900; }
        .dice.rolling { animation: shake 0.5s infinite; }
        @keyframes shake { 0% { transform: rotate(0deg); } 25% { transform: rotate(15deg); } 50% { transform: rotate(0deg); } 75% { transform: rotate(-15deg); } 100% { transform: rotate(0deg); } }

        /* Слоты */
        .slots-area { display: flex; justify-content: center; gap: 10px; background: var(--surface); padding: 20px; border-radius: 16px; margin: 20px 0; }
        .slot { width: 70px; height: 90px; background: #000; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 40px; border: 2px solid rgba(255,255,255,0.1); }

        /* Меню игр */
        .games-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding-bottom: 20px; }
        .game-card { background: var(--surface); border-radius: 20px; height: 140px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: 900; font-size: 14px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); transition: transform 0.2s; }
        .game-card:active { transform: scale(0.96); }
        .game-card .icon { font-size: 40px; margin-bottom: 10px; }

        /* Профиль */
        .profile-card { display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: 20px;}
        .avatar-img { width: 100px; height: 100px; border-radius: 50%; background: var(--surface); border: 3px solid var(--primary); margin-bottom: 15px; object-fit: cover; }
        .avatar-placeholder { width: 100px; height: 100px; border-radius: 50%; background: var(--secondary); display: flex; justify-content: center; align-items: center; font-size: 40px; font-weight: 900; margin-bottom: 15px; }
        .user-name { font-size: 24px; font-weight: 900; }
        .user-username { font-size: 14px; color: var(--hint); margin-bottom: 5px; }
        .user-date { font-size: 12px; color: var(--gold); margin-bottom: 20px; }
        
        .profile-stats { width: 100%; background: var(--surface); border-radius: 16px; padding: 15px; margin-bottom: 20px; }
        .stat-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: var(--hint); font-size: 14px; }
        .stat-value { font-weight: 900; font-size: 14px; }

        /* Нижнее меню */
        .bottom-nav { display: flex; background: var(--surface); margin: 10px 20px; margin-bottom: max(20px, env(safe-area-inset-bottom)); border-radius: 30px; padding: 10px; justify-content: space-around; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        .nav-btn { display: flex; flex-direction: column; align-items: center; color: var(--hint); font-size: 10px; font-weight: 800; cursor: pointer; padding: 8px 20px; border-radius: 20px; transition: 0.3s; }
        .nav-btn svg { width: 24px; height: 24px; fill: currentColor; margin-bottom: 4px; }
        .nav-btn.active { color: var(--text); background: rgba(255,255,255,0.1); }

        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
    </style>
</head>
<body>

    <div class="header">
        <div class="balance-box">
            <span class="balance-label">Баланс</span>
            <span class="balance" id="balance">0</span>
        </div>
    </div>

    <!-- ЭКРАН 1: ИГРА -->
    <div id="screen-play" class="screen active">
        <div class="game-header">
            <div class="game-title" id="current-game-title">Рулетка</div>
        </div>
        
        <div class="bet-box" id="play-bet-box">
            <div style="font-weight: 800; font-size: 14px;">Ставка</div>
            <div class="bet-controls">
                <button class="bet-btn" onclick="changeBet(-50)">-</button>
                <input type="number" class="bet-input" id="bet-input" value="10" min="10">
                <button class="bet-btn" onclick="changeBet(50)">+</button>
            </div>
        </div>

        <!-- 1. Рулетка -->
        <div id="game-roulette-view" style="width:100%;">
            <div class="roulette-container">
                <div class="pointer"></div>
                <div class="roulette-strip" id="strip"></div>
            </div>
            <p id="roulette-result" style="font-weight:900; height:30px; text-align:center;"></p>
            <button class="btn" id="spinBtn" onclick="spin()">Крутить</button>
        </div>

        <!-- 2. Кости -->
        <div id="game-dice-view" style="width:100%; display:none; text-align:center;">
            <div class="dice-area">
                <div class="dice" id="dice1">🎲</div>
                <div class="dice" id="dice2">🎲</div>
            </div>
            <p id="dice-result" style="font-weight:900; height:30px;"></p>
            <button class="btn" id="diceBtn" onclick="rollDice()">Бросить (Сумма 7 или 11 = x2)</button>
        </div>

        <!-- 3. Слоты -->
        <div id="game-slots-view" style="width:100%; display:none; text-align:center;">
            <div class="slots-area">
                <div class="slot" id="slot1">🍒</div>
                <div class="slot" id="slot2">🍒</div>
                <div class="slot" id="slot3">🍒</div>
            </div>
            <p id="slots-result" style="font-weight:900; height:30px;"></p>
            <button class="btn" id="slotsBtn" onclick="spinSlots()">Крутить слоты (3 в ряд = x5)</button>
        </div>
    </div>

    <!-- ЭКРАН 2: МЕНЮ ИГР -->
    <div id="screen-games" class="screen">
        <h2 style="margin-bottom: 20px;">Выбери игру</h2>
        <div class="games-grid">
            <div class="game-card" onclick="selectGame('roulette', 'Рулетка')"><div class="icon">🎰</div>Рулетка</div>
            <div class="game-card" onclick="selectGame('dice', 'Кости')"><div class="icon">🎲</div>Кости</div>
            <div class="game-card" onclick="selectGame('slots', 'Слоты')"><div class="icon">🍒</div>Слоты</div>
            <!-- Остальные плитки, которые ты можешь добавить позже -->
            <div class="game-card" style="opacity:0.5" onclick="Telegram.WebApp.showAlert('В разработке')"><div class="icon">💣</div>Мины</div>
            <div class="game-card" style="opacity:0.5" onclick="Telegram.WebApp.showAlert('В разработке')"><div class="icon">🏰</div>Башня</div>
            <div class="game-card" style="opacity:0.5" onclick="Telegram.WebApp.showAlert('В разработке')"><div class="icon">🪙</div>Монетка</div>
        </div>
    </div>

    <!-- ЭКРАН 3: ПРОФИЛЬ -->
    <div id="screen-profile" class="screen">
        <div class="profile-card">
            <div id="avatar-container">
                <div class="avatar-placeholder" id="avatar-initials">U</div>
            </div>
            <div class="user-name" id="tg-name">Игрок</div>
            <div class="user-username" id="tg-username">@username</div>
            <div class="user-date" id="reg-date">Дата регистрации: Сегодня</div>
        </div>

        <div class="profile-stats">
            <div class="stat-row">
                <span class="stat-label">Текущий баланс</span>
                <span class="stat-value" style="color:var(--money)" id="profile-balance">0 ₽</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Игровой статус</span>
                <span class="stat-value" style="color:var(--gold)">VIP Игрок</span>
            </div>
        </div>

        <button class="btn" style="background: linear-gradient(45deg, var(--gold), #ff8c00); color: #000;" onclick="claimBonus()">🎁 Забрать ежедневный бонус</button>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-nav">
        <div class="nav-btn active" onclick="switchTab('play', this)">
            <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2z"/></svg> Играть
        </div>
        <div class="nav-btn" onclick="switchTab('games', this)">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg> Игры
        </div>
        <div class="nav-btn" onclick="switchTab('profile', this)">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg> Профиль
        </div>
    </div>

    <canvas id="confettiCanvas"></canvas>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        Telegram.WebApp.setHeaderColor('#0a0a0c');
        Telegram.WebApp.disableVerticalSwipes();

        // --- ДАННЫЕ ИЗ ТЕЛЕГРАМА ---
        const tgUser = Telegram.WebApp.initDataUnsafe?.user;
        const balanceEl = document.getElementById('balance');
        const profileBalanceEl = document.getElementById('profile-balance');
        const betInput = document.getElementById('bet-input');

        if (tgUser) {
            document.getElementById('tg-name').innerText = tgUser.first_name;
            document.getElementById('tg-username').innerText = tgUser.username ? '@' + tgUser.username : 'Без юзернейма';
            document.getElementById('avatar-initials').innerText = tgUser.first_name.charAt(0).toUpperCase();
            
            if (tgUser.photo_url) {
                const img = document.createElement('img');
                img.src = tgUser.photo_url;
                img.className = 'avatar-img';
                document.getElementById('avatar-container').innerHTML = '';
                document.getElementById('avatar-container').appendChild(img);
            }
            
            let regDate = localStorage.getItem('reg_date');
            if (!regDate) { regDate = new Date().toLocaleDateString('ru-RU'); localStorage.setItem('reg_date', regDate); }
            document.getElementById('reg-date').innerText = `В Gearfe Casino с: ${regDate}`;
        }

        // --- БАЛАНС ---
        let balance = parseInt(localStorage.getItem('casino_balance')) || 1000;
        function updateBalance(amount) {
            balance += amount;
            localStorage.setItem('casino_balance', balance);
            balanceEl.innerText = balance;
            profileBalanceEl.innerText = balance + ' ₽';
            balanceEl.style.color = amount > 0 ? 'var(--money)' : 'var(--primary)';
            setTimeout(() => balanceEl.style.color = 'var(--money)', 500);
        }
        balanceEl.innerText = balance;
        profileBalanceEl.innerText = balance + ' ₽';

        function switchTab(screenId, btn) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + screenId).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        function selectGame(gameId, gameName) {
            document.getElementById('current-game-title').innerText = gameName;
            document.querySelectorAll('[id^="game-"][id$="-view"]').forEach(g => g.style.display = 'none');
            if(gameId === 'roulette') document.getElementById('game-roulette-view').style.display = 'block';
            if(gameId === 'dice') document.getElementById('game-dice-view').style.display = 'block';
            if(gameId === 'slots') document.getElementById('game-slots-view').style.display = 'block';
            
            document.querySelectorAll('.nav-btn')[0].click(); // Переходим на вкладку Играть
        }

        function changeBet(amount) {
            let current = parseInt(betInput.value) || 0;
            let newVal = current + amount;
            if (newVal < 10) newVal = 10;
            if (newVal > balance) newVal = balance;
            betInput.value = newVal;
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        betInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
            if(this.value > balance) this.value = balance;
        });

        function placeBet() {
            const betAmount = parseInt(betInput.value) || 0;
            if (betAmount > balance) { Telegram.WebApp.showAlert('Недостаточно средств!'); return false; }
            if (betAmount < 10) { Telegram.WebApp.showAlert('Мин. ставка 10₽'); return false; }
            updateBalance(-betAmount);
            return betAmount;
        }

        function claimBonus() {
            const lastBonus = localStorage.getItem('last_bonus');
            if (!lastBonus || Date.now() - lastBonus > 24 * 60 * 60 * 1000) {
                updateBalance(1000);
                localStorage.setItem('last_bonus', Date.now());
                Telegram.WebApp.showAlert('Вы получили 1000 ₽ бонуса!');
                fireConfetti(100);
            } else {
                Telegram.WebApp.showAlert('Бонус уже получен! Возвращайтесь завтра.');
            }
        }

        // --- РУЛЕТКА ---
        const items = [
            { name: 'Хлам', class: 'r-common', mult: 1, chance: 50 },
            { name: 'Монета', class: 'r-uncommon', mult: 2, chance: 25 },
            { name: 'Кристалл', class: 'r-rare', mult: 3, chance: 15 },
            { name: 'Артефакт', class: 'r-epic', mult: 5, chance: 8 },
            { name: 'ДЖЕКПОТ', class: 'r-legendary', mult: 10, chance: 2 }
        ];
        const strip = document.getElementById('strip');
        const rouletteResult = document.getElementById('roulette-result');
        const spinBtn = document.getElementById('spinBtn');
        const ITEM_WIDTH = 100; 

        function renderItems() {
            strip.innerHTML = '';
            for (let i = 0; i < 30; i++) {
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = `r-item ${item.class}`;
                    div.innerHTML = `<div>${item.name}</div><div style="font-size:10px; margin-top:5px;">x${item.mult}</div>`;
                    strip.appendChild(div);
                });
            }
        }

        function spin() {
            const bet = placeBet();
            if (!bet) return;
            spinBtn.disabled = true;
            rouletteResult.innerText = '';
            strip.classList.add('spinning');
            
            const rand = Math.random() * 100;
            let acc = 0;
            let winIndex = 0;
            for(let i=0; i<items.length; i++) {
                acc += items[i].chance;
                if(rand <= acc) { winIndex = i; break; }
            }

            strip.style.transition = 'transform 3s cubic-bezier(0.1, 0.9, 0.2, 1)'; 
            const loops = 5 + Math.floor(Math.random() * 3);
            const targetItemIndex = (loops * items.length) + winIndex;
            const centerOffset = window.innerWidth / 2;
            const itemCenter = (ITEM_WIDTH / 2);
            const shift = (targetItemIndex * ITEM_WIDTH) - centerOffset + itemCenter;

            strip.style.animation = 'none';
            strip.offsetHeight; 
            strip.style.transform = `translateX(-${shift}px)`;

            setTimeout(() => {
                const wonItem = items[winIndex];
                const winAmount = Math.floor(bet * wonItem.mult);
                
                if (wonItem.mult > 1) {
                    updateBalance(winAmount);
                    rouletteResult.innerHTML = `<span style="font-size:20px; color:var(--money)">${wonItem.name} (+${winAmount} ₽)</span>`;
                    fireConfetti(wonItem.mult * 20);
                    Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                } else {
                    rouletteResult.innerHTML = `<span style="font-size:20px; color:var(--primary)">${wonItem.name} (Проигрыш)</span>`;
                }
                spinBtn.disabled = false;
                setTimeout(() => {
                    strip.style.transition = 'none';
                    strip.style.transform = 'translateX(0)';
                    strip.classList.remove('spinning');
                }, 100);
            }, 3100); 
        }

        // --- КОСТИ ---
        const dice1 = document.getElementById('dice1');
        const dice2 = document.getElementById('dice2');
        const diceResult = document.getElementById('dice-result');
        const diceBtn = document.getElementById('diceBtn');
        let diceRolling = false;

        function rollDice() {
            if (diceRolling) return;
            const bet = placeBet();
            if (!bet) return;
            diceRolling = true;
            diceBtn.disabled = true;
            diceResult.innerText = '';
            dice1.classList.add('rolling');
            dice2.classList.add('rolling');
            
            let count = 0;
            const interval = setInterval(() => {
                dice1.innerText = Math.floor(Math.random() * 6) + 1;
                dice2.innerText = Math.floor(Math.random() * 6) + 1;
                count++;
                if (count > 15) {
                    clearInterval(interval);
                    dice1.classList.remove('rolling');
                    dice2.classList.remove('rolling');
                    const val1 = Math.floor(Math.random() * 6) + 1;
                    const val2 = Math.floor(Math.random() * 6) + 1;
                    dice1.innerText = val1;
                    dice2.innerText = val2;
                    const sum = val1 + val2;
                    if (sum === 7 || sum === 11) {
                        const winAmount = bet * 2;
                        updateBalance(winAmount);
                        diceResult.innerHTML = `Сумма: ${sum} <br><span style="color:var(--money)">Победа! (+${winAmount} ₽)</span>`;
                        fireConfetti(80);
                        Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                    } else {
                        diceResult.innerHTML = `Сумма: ${sum} <br><span style="color:var(--primary)">Проигрыш</span>`;
                    }
                    diceRolling = false;
                    diceBtn.disabled = false;
                }
            }, 100);
        }

        // --- СЛОТЫ ---
        const slot1 = document.getElementById('slot1');
        const slot2 = document.getElementById('slot2');
        const slot3 = document.getElementById('slot3');
        const slotsResult = document.getElementById('slots-result');
        const slotsBtn = document.getElementById('slotsBtn');
        let slotsSpinning = false;
        const slotItems = ['🍒', '🍋', '🍉', '💎', '7️⃣'];

        function spinSlots() {
            if (slotsSpinning) return;
            const bet = placeBet();
            if (!bet) return;
            slotsSpinning = true;
            slotsBtn.disabled = true;
            slotsResult.innerText = '';

            let count = 0;
            const interval = setInterval(() => {
                slot1.innerText = slotItems[Math.floor(Math.random() * slotItems.length)];
                slot2.innerText = slotItems[Math.floor(Math.random() * slotItems.length)];
                slot3.innerText = slotItems[Math.floor(Math.random() * slotItems.length)];
                count++;
                if (count > 15) {
                    clearInterval(interval);
                    checkSlots(bet);
                }
            }, 100);
        }

        function checkSlots(bet) {
            const val1 = slotItems[Math.floor(Math.random() * slotItems.length)];
            const val2 = slotItems[Math.floor(Math.random() * slotItems.length)];
            const val3 = slotItems[Math.floor(Math.random() * slotItems.length)];
            slot1.innerText = val1;
            slot2.innerText = val2;
            slot3.innerText = val3;

            if (val1 === val2 && val2 === val3) {
                const winAmount = bet * 5;
                updateBalance(winAmount);
                slotsResult.innerHTML = `ДЖЕКПОТ! <br><span style="color:var(--money)">+${winAmount} ₽</span>`;
                fireConfetti(150);
                Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            } else {
                slotsResult.innerHTML = `<span style="color:var(--primary)">Попробуй еще раз!</span>`;
            }
            slotsSpinning = false;
            slotsBtn.disabled = false;
        }

        // --- КОНФЕТТИ ---
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        function fireConfetti(count = 100) {
            const colors = ['#ff0055', '#7000ff', '#00ffcc', '#ffd700', '#00e676'];
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: window.innerWidth / 2, y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 25, vy: (Math.random() - 1) * 25,
                    size: Math.random() * 8 + 4, color: colors[Math.floor(Math.random() * colors.length)], life: 1
                });
            }
            requestAnimationFrame(updateConfetti);
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy; p.vy += 0.6; p.vx *= 0.96; p.life -= 0.015;
                if (p.life > 0) {
                    active = true; ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                }
            });
            ctx.globalAlpha = 1;
            if (active) requestAnimationFrame(updateConfetti);
        }

        renderItems();
    </script>
</body>
</html>
