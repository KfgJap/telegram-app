<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Gearfe Casino</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap');

        :root {
            --bg: #0a0a0c;
            --surface: #16161a;
            --text: #ffffff;
            --hint: #888888;
            --primary: #ff0055;
            --secondary: #7000ff;
            --money: #00e676;
            
            /* Цвета редкостей */
            --r-common: #9e9e9e;
            --r-uncommon: #4caf50;
            --r-rare: #2196f3;
            --r-epic: #9c27b0;
            --r-legendary: #ff9800;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Шапка */
        .header {
            background: var(--surface);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
        }
        
        .balance-box { display: flex; flex-direction: column; }
        .balance-label { font-size: 10px; color: var(--hint); text-transform: uppercase; }
        .balance { font-size: 22px; font-weight: 900; color: var(--money); }
        
        .daily-btn {
            background: linear-gradient(45deg, #ff8c00, #ffd700);
            color: #000; border: none; padding: 8px 15px; border-radius: 8px;
            font-weight: 900; font-size: 12px; cursor: pointer;
        }

        /* Экраны */
        .screen { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
        .screen.active { display: flex; }

        /* Блок ставки */
        .bet-box {
            width: 100%; max-width: 340px; background: var(--surface);
            border-radius: 12px; padding: 15px; margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05); text-align: center;
        }
        .bet-box label { display: block; font-size: 12px; color: var(--hint); margin-bottom: 8px; font-weight: 800;}
        
        /* ПОЧИНИЛИ РАМКУ СТАВКИ */
        .bet-controls { 
            display: flex; align-items: center; justify-content: space-between; 
            background: rgba(0,0,0,0.3); border-radius: 8px; padding: 5px; gap: 10px;
        }
        .bet-btn {
            width: 40px; height: 40px; border-radius: 8px; border: none;
            background: rgba(255,255,255,0.1); color: #fff; font-size: 20px;
            font-weight: 900; cursor: pointer; flex-shrink: 0;
        }
        .bet-input { 
            flex: 1; width: 100%; background: transparent; border: none; 
            color: #fff; font-size: 20px; font-weight: 900; text-align: center; outline: none;
        }

        /* Навигация */
        .bottom-nav {
            display: flex; background: var(--surface); border-top: 1px solid rgba(255,255,255,0.05);
            padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom));
            justify-content: space-around; z-index: 100;
        }
        .nav-btn {
            display: flex; flex-direction: column; align-items: center;
            color: var(--hint); font-size: 10px; font-weight: 800; cursor: pointer; padding: 5px;
        }
        .nav-btn svg { width: 22px; height: 22px; fill: currentColor; margin-bottom: 4px; }
        .nav-btn.active { color: var(--text); }

        /* Рулетка */
        .roulette-container { width: 100vw; overflow: hidden; position: relative; padding: 20px 0; background: linear-gradient(90deg, rgba(0,0,0,0.9) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.9) 100%); border-top: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 20px;}
        .roulette-strip { display: flex; transition: transform 4s cubic-bezier(0.1, 0.9, 0.2, 1); gap: 10px; padding-left: 50vw; }
        
        .item { 
            min-width: 80px; height: 80px; display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-radius: 12px; font-weight: 900; font-size: 12px; text-align: center; padding: 5px; 
            border: 2px solid; word-break: break-word; background: rgba(0,0,0,0.5);
        }
        .item .price { font-size: 10px; margin-top: 5px; color: var(--money); }
        
        /* Классы редкости для квадратиков */
        .r-common { border-color: var(--r-common); box-shadow: inset 0 0 10px rgba(158,158,158,0.2); }
        .r-uncommon { border-color: var(--r-uncommon); box-shadow: inset 0 0 10px rgba(76,175,80,0.2); }
        .r-rare { border-color: var(--r-rare); box-shadow: inset 0 0 10px rgba(33,150,243,0.3); }
        .r-epic { border-color: var(--r-epic); box-shadow: inset 0 0 15px rgba(156,39,176,0.4); }
        .r-legendary { border-color: var(--r-legendary); box-shadow: inset 0 0 20px rgba(255,152,0,0.6); }

        .pointer { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; background: #fff; z-index: 10; transform: translateX(-50%); box-shadow: 0 0 15px #fff; }

        /* Монетка */
        .coin {
            width: 140px; height: 140px; border-radius: 50%; background: linear-gradient(135deg, #ffd700, #b8860b);
            display: flex; justify-content: center; align-items: center; font-size: 60px; font-weight: 900; color: #000;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4); margin-bottom: 30px; cursor: pointer;
            transition: transform 3s ease-out;
        }
        .coin.spinning { animation: spinCoin 3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes spinCoin { 0% { transform: rotateY(0deg) scale(1); } 50% { transform: rotateY(1800deg) scale(1.2); } 100% { transform: rotateY(3600deg) scale(1); } }

        /* Мины */
        .mine-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; width: 100%; max-width: 300px;}
        .mine-cell {
            width: 100%; aspect-ratio: 1; background: var(--surface); border-radius: 12px; display: flex; justify-content: center; align-items: center;
            font-size: 30px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05);
        }
        .mine-cell.safe { background: var(--money); color: #000; pointer-events: none; }
        .mine-cell.bomb { background: var(--primary); color: #fff; pointer-events: none; }
        .mine-multiplier { font-size: 24px; font-weight: 900; color: #ffd700; margin-bottom: 15px;}

        /* Кнопки */
        .btn { 
            padding: 15px 30px; font-size: 16px; cursor: pointer; width: 100%; max-width: 300px;
            background: linear-gradient(45deg, var(--primary), var(--secondary)); color: white;
            border: none; border-radius: 12px; font-weight: 900; text-transform: uppercase;
        }
        .btn:disabled { opacity: 0.5; }
        .btn-cashout { background: linear-gradient(45deg, var(--money), #00b359); }
        
        #roulette-result { font-size: 20px; font-weight: 900; height: 30px; margin-bottom: 15px; text-align: center; }

        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
    </style>
</head>
<body>

    <div class="header">
        <div class="balance-box">
            <span class="balance-label">Баланс</span>
            <span class="balance" id="balance">0</span>
        </div>
        <button class="daily-btn" id="dailyBtn" onclick="claimBonus()">🎁 Бонус</button>
    </div>

    <!-- РУЛЕТКА -->
    <div id="screen-roulette" class="screen active">
        <div class="bet-box">
            <label>Ваша ставка</label>
            <div class="bet-controls">
                <button class="bet-btn" onclick="changeBet(-10, 'roulette')">-</button>
                <input type="number" class="bet-input" id="bet-roulette" value="10" readonly>
                <button class="bet-btn" onclick="changeBet(10, 'roulette')">+</button>
            </div>
        </div>
        <div class="roulette-container">
            <div class="pointer"></div>
            <div class="roulette-strip" id="strip"></div>
        </div>
        <p id="roulette-result"></p>
        <button class="btn" id="spinBtn" onclick="spin()">Крутить</button>
    </div>

    <!-- МОНЕТКА -->
    <div id="screen-coin" class="screen">
        <div class="bet-box">
            <label>Ваша ставка</label>
            <div class="bet-controls">
                <button class="bet-btn" onclick="changeBet(-10, 'coin')">-</button>
                <input type="number" class="bet-input" id="bet-coin" value="10" readonly>
                <button class="bet-btn" onclick="changeBet(10, 'coin')">+</button>
            </div>
        </div>
        <div class="coin" id="coin" onclick="flipCoin()">?</div>
        <p id="coin-result" style="font-size: 18px; font-weight: 800; height: 25px; margin-bottom: 15px; text-align: center;"></p>
    </div>

    <!-- МИНЫ -->
    <div id="screen-mines" class="screen">
        <div class="bet-box" id="mines-bet-box">
            <label>Ваша ставка</label>
            <div class="bet-controls">
                <button class="bet-btn" onclick="changeBet(-10, 'mines')">-</button>
                <input type="number" class="bet-input" id="bet-mines" value="10" readonly>
                <button class="bet-btn" onclick="changeBet(10, 'mines')">+</button>
            </div>
        </div>
        <div class="mine-multiplier" id="mine-mult" style="display: none;">x<span>1.0</span></div>
        <div class="mine-grid" id="mine-grid"></div>
        <button class="btn" id="mineBtn">Играть</button>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div class="bottom-nav">
        <div class="nav-btn active" onclick="switchTab('roulette', this)">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
            Рулетка
        </div>
        <div class="nav-btn" onclick="switchTab('coin', this)">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
            Монетка
        </div>
        <div class="nav-btn" onclick="switchTab('mines', this)">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
            Мины
        </div>
    </div>

    <canvas id="confettiCanvas"></canvas>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        Telegram.WebApp.setHeaderColor('#0a0a0c');
        Telegram.WebApp.disableVerticalSwipes();

        // --- БАЛАНС ---
        let balance = parseInt(localStorage.getItem('casino_balance')) || 1000;
        const balanceEl = document.getElementById('balance');
        const dailyBtn = document.getElementById('dailyBtn');

        function updateBalance(amount) {
            balance += amount;
            localStorage.setItem('casino_balance', balance);
            balanceEl.innerText = balance;
            balanceEl.style.color = amount > 0 ? 'var(--money)' : 'var(--primary)';
            setTimeout(() => balanceEl.style.color = 'var(--money)', 500);
        }

        function initBalance() {
            balanceEl.innerText = balance;
            const lastBonus = localStorage.getItem('last_bonus');
            if (!lastBonus || Date.now() - lastBonus > 24 * 60 * 60 * 1000) {
                dailyBtn.style.display = 'block';
            } else {
                dailyBtn.style.display = 'none';
            }
        }

        function claimBonus() {
            updateBalance(1000);
            localStorage.setItem('last_bonus', Date.now());
            dailyBtn.style.display = 'none';
            Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            fireConfetti(100);
        }

        function switchTab(screenId, btn) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + screenId).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        function changeBet(amount, game) {
            const input = document.getElementById('bet-' + game);
            let current = parseInt(input.value);
            let newVal = current + amount;
            if (newVal < 10) newVal = 10;
            if (newVal > balance) newVal = balance;
            input.value = newVal;
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        function placeBet(game) {
            const input = document.getElementById('bet-' + game);
            const betAmount = parseInt(input.value);
            if (betAmount > balance) { Telegram.WebApp.showAlert('Недостаточно средств!'); return false; }
            if (betAmount <= 0) return false;
            updateBalance(-betAmount);
            return betAmount;
        }

        // ==========================================
        // НОВАЯ РУЛЕТКА (С РЕДКОСТЯМИ)
        // ==========================================
        // Награды: Серый = x1, Зеленый = x2, Синий = x3, Фиолетовый = x5, Желтый = x10
        const items = [
            { name: 'Хлам', class: 'r-common', mult: 1 },
            { name: 'Монета', class: 'r-uncommon', mult: 2 },
            { name: 'Кристалл', class: 'r-rare', mult: 3 },
            { name: 'Артефакт', class: 'r-epic', mult: 5 },
            { name: 'ДЖЕКПОТ', class: 'r-legendary', mult: 10 }
        ];
        
        const strip = document.getElementById('strip');
        const rouletteResult = document.getElementById('roulette-result');
        const spinBtn = document.getElementById('spinBtn');
        const ITEM_WIDTH = 90; // 80px + 10px gap

        function renderItems() {
            strip.style.transition = 'none';
            strip.style.transform = `translateX(0px)`;
            strip.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = `item ${item.class}`;
                    div.innerHTML = `<div>${item.name}</div><div class="price">x${item.mult}</div>`;
                    strip.appendChild(div);
                });
            }
        }

        function spin() {
            const bet = placeBet('roulette');
            if (!bet) return;

            spinBtn.disabled = true;
            rouletteResult.innerText = '';
            strip.style.transition = 'none';
            strip.style.transform = `translateX(0px)`;
            
            // Рандом с учетом шансов (чем круче, тем реже)
            const rand = Math.random() * 100;
            let randomIndex = 0;
            if (rand < 50) randomIndex = 0; // 50% Хлам
            else if (rand < 75) randomIndex = 1; // 25% Монета
            else if (rand < 90) randomIndex = 2; // 15% Кристалл
            else if (rand < 98) randomIndex = 3; // 8% Артефакт
            else randomIndex = 4; // 2% ДЖЕКПОТ
            
            const targetIndex = ((7 + Math.floor(Math.random() * 2)) * items.length) + randomIndex;
            const offset = -(targetIndex * ITEM_WIDTH) - (80 / 2) + (window.innerWidth / 2);
            
            setTimeout(() => {
                strip.style.transition = 'transform 4s cubic-bezier(0.1, 0.9, 0.2, 1)';
                strip.style.transform = `translateX(${offset}px)`;
            }, 50);

            setTimeout(() => {
                const wonItem = items[randomIndex];
                const winAmount = bet * wonItem.mult;
                
                // Если это не окупилось (хлам), вычитаем ставку
                if (wonItem.mult > 1) {
                    updateBalance(winAmount);
                    rouletteResult.innerHTML = `<span style="color:var(--${wonItem.class.replace('r-', '')})">${wonItem.name}</span> (+${winAmount} ₽)`;
                } else {
                    rouletteResult.innerHTML = `<span style="color:var(--${wonItem.class.replace('r-', '')})">${wonItem.name}</span> (Вы проиграли)`;
                }
                
                spinBtn.disabled = false;
                if (wonItem.mult > 2) {
                    Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                    fireConfetti(wonItem.mult * 20);
                }
            }, 4100); 
        }

        // ==========================================
        // МОНЕТКА
        // ==========================================
        const coin = document.getElementById('coin');
        const coinResult = document.getElementById('coin-result');
        let isFlipping = false;

        function flipCoin() {
            if (isFlipping) return;
            const bet = placeBet('coin');
            if (!bet) return;

            isFlipping = true;
            coinResult.innerText = '';
            coin.innerText = '?';
            
            coin.classList.add('spinning');
            Telegram.WebApp.HapticFeedback.impactOccurred('medium');

            setTimeout(() => {
                const isHeads = Math.random() > 0.5;
                coin.innerText = isHeads ? 'ОРЁЛ' : 'РЕШКА';
                coin.classList.remove('spinning');
                
                const winAmount = bet * 2;
                updateBalance(winAmount);
                coinResult.innerText = `${isHeads ? 'Орёл' : 'Решка'}! (+${winAmount} ₽)`;
                
                isFlipping = false;
                Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                fireConfetti(80);
            }, 3000);
        }

        // ==========================================
        // МИНЫ
        // ==========================================
        const mineGrid = document.getElementById('mine-grid');
        const mineBtn = document.getElementById('mineBtn');
        const mineMult = document.getElementById('mine-mult');
        let mineGameActive = false;
        let bombs = [];
        let safeCells = 0;
        let currentBet = 0;

        const multipliers = [1.0, 1.5, 2.2, 3.5, 6.0, 12.0];

        function initMines() {
            mineGrid.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'mine-cell';
                cell.innerText = '❓';
                cell.onclick = () => clickMine(i, cell);
                mineGrid.appendChild(cell);
            }
        }

        function startMines() {
            if (mineGameActive) return; // Если игра идет, кнопка работает как "Забрать"
            
            const bet = placeBet('mines');
            if (!bet) return;

            currentBet = bet;
            mineGameActive = true;
            safeCells = 0;
            
            mineMult.style.display = 'block';
            mineMult.innerHTML = 'x<span>1.0</span>';
            mineBtn.innerText = 'Забрать';
            mineBtn.classList.add('btn-cashout');
            
            bombs = [];
            while(bombs.length < 3) {
                const r = Math.floor(Math.random() * 9);
                if(!bombs.includes(r)) bombs.push(r);
            }
            
            initMines();
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        function clickMine(index, cell) {
            if (!mineGameActive) return;
            if (cell.classList.contains('safe') || cell.classList.contains('bomb')) return;

            if (bombs.includes(index)) {
                cell.classList.add('bomb');
                cell.innerText = '💥';
                mineGameActive = false;
                mineBtn.innerText = 'Играть';
                mineBtn.classList.remove('btn-cashout');
                Telegram.WebApp.HapticFeedback.notificationOccurred('error');
                
                document.querySelectorAll('.mine-cell').forEach((c, i) => {
                    if(bombs.includes(i) && !c.classList.contains('bomb')) {
                        c.innerText = '💣'; c.classList.add('bomb');
                    }
                });
            } else {
                cell.classList.add('safe');
                cell.innerText = '💎';
                safeCells++;
                
                const mult = multipliers[safeCells];
                mineMult.innerHTML = `x<span>${mult.toFixed(1)}</span>`;
                Telegram.WebApp.HapticFeedback.impactOccurred('light');
                fireConfetti(15);

                if (safeCells === 6) cashoutMines();
            }
        }

        function cashoutMines() {
            if (!mineGameActive) return;
            mineGameActive = false;
            mineBtn.innerText = 'Играть';
            mineBtn.classList.remove('btn-cashout');
            
            if(safeCells > 0) {
                const winAmount = Math.floor(currentBet * multipliers[safeCells]);
                updateBalance(winAmount);
                Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                fireConfetti(150);
            }
        }
        
        mineBtn.onclick = function() { if (mineGameActive) cashoutMines(); else startMines(); };

        // ==========================================
        // КОНФЕТТИ
        // ==========================================
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        function fireConfetti(count = 100) {
            const colors = ['#ff0055', '#7000ff', '#00ffcc', '#ffd700', '#00e676'];
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: window.innerWidth / 2, y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 25, vy: (Math.random() - 1) * 25,
                    size: Math.random() * 8 + 4, color: colors[Math.floor(Math.random() * colors.length)], life: 1
                });
            }
            requestAnimationFrame(updateConfetti);
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy; p.vy += 0.6; p.vx *= 0.96; p.life -= 0.015;
                if (p.life > 0) {
                    active = true; ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                }
            });
            ctx.globalAlpha = 1;
            if (active) requestAnimationFrame(updateConfetti);
        }

        initBalance();
        renderItems();
        initMines();
    </script>
</body>
</html>
