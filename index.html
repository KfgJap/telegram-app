<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Gearfe Casino: Clean Roulette</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Oswald:wght@500;700&display=swap');
        
        :root {
            --bg: #030712; --surface: #0f172a; --text: #f8fafc; --hint: #64748b;
            --primary: #0ea5e9; --money: #10b981; --gold: #f59e0b; --error: #ef4444;
            --radius: 16px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
            user-select: none; 
        }

        /* Шапка */
        .header { 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: var(--surface); 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            z-index: 10;
        }
        .balance-label { font-size: 10px; color: var(--hint); text-transform: uppercase; font-weight: 800; }
        .balance { font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 900; color: var(--money); }

        /* Главный блок */
        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            padding: 15px; 
            max-width: 500px; 
            margin: 0 auto; 
            width: 100%;
        }

        /* --- СИСТЕМА СТАВОК --- */
        .bet-section {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 20px;
            position: relative;
            z-index: 20;
        }

        .bet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .bet-title { font-size: 12px; color: var(--hint); text-transform: uppercase; font-weight: 800; }
        
        .bet-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #000;
            border-radius: 12px;
            padding: 5px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .bet-btn {
            width: 40px; height: 40px;
            background: rgba(255,255,255,0.1);
            border: none; border-radius: 8px;
            color: #fff; font-size: 20px; font-weight: 900;
            cursor: pointer;
        }
        .bet-btn:active { background: rgba(255,255,255,0.2); }

        .bet-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 24px;
            font-weight: 900;
            text-align: center;
            outline: none;
            width: 100%;
        }

        /* Кнопка вызова быстрых ставок */
        .quick-bet-toggle {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: none;
            color: var(--primary);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: 900;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .quick-bet-toggle:active { background: rgba(255,255,255,0.1); }

        /* Выдвижная панель быстрых ставок */
        .quick-bet-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: #000;
            border-radius: 8px;
            margin-top: 5px;
        }
        .quick-bet-panel.open {
            max-height: 200px;
        }

        .quick-bet-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            padding: 10px;
        }

        .quick-bet-btn {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 10px 5px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
        }
        .quick-bet-btn:active { background: var(--primary); color: #000; }

        .quick-bet-bottom {
            display: flex;
            justify-content: space-between;
            padding: 0 10px 10px 10px;
        }
        .quick-bet-control {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            width: 40px; height: 30px;
            border-radius: 6px;
            font-weight: 900;
            cursor: pointer;
        }

        /* --- РУЛЕТКА --- */
        .roulette-container { 
            width: 100%; 
            height: 120px; 
            background: #000; 
            border-radius: var(--radius); 
            position: relative; 
            overflow: hidden; 
            border: 1px solid rgba(255,255,255,0.1); 
            margin-bottom: 20px;
        }
        .roulette-strip { display: flex; height: 100%; align-items: center; }
        .pointer { 
            position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; 
            background: #fff; transform: translateX(-50%); z-index: 10; 
            box-shadow: 0 0 15px #fff; border-radius: 2px;
        }

        .result-text { 
            text-align: center; 
            font-weight: 900; 
            height: 40px; 
            color: var(--primary); 
            font-size: 24px;
            margin-bottom: 10px;
        }

        .spin-btn { 
            padding: 18px; 
            font-size: 18px; 
            cursor: pointer; 
            width: 100%; 
            background: linear-gradient(180deg, var(--primary), #0284c7); 
            color: #fff; 
            border: none; 
            border-radius: var(--radius); 
            font-weight: 900; 
            text-transform: uppercase; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .spin-btn:active { transform: scale(0.98); }
        .spin-btn:disabled { opacity: 0.5; pointer-events: none; }

        /* --- ТОСТЫ --- */
        .toast { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); 
            background: var(--surface); color: #fff; padding: 10px 20px; border-radius: 30px; 
            font-weight: 800; font-size: 14px; z-index: 3000; opacity: 0; 
            transition: 0.3s; pointer-events: none; border: 1px solid var(--primary); 
        }
        .toast.show { opacity: 1; top: 30px; }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header class="header">
        <div>
            <span class="balance-label">Баланс</span><br>
            <span class="balance" id="balance">1000</span>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="main-content">
        
        <!-- Блок ставок -->
        <div class="bet-section">
            <div class="bet-header">
                <span class="bet-title">Ваша ставка</span>
            </div>
            
            <div class="bet-controls">
                <button class="bet-btn" onclick="changeBet(-50)">-</button>
                <input type="number" class="bet-input" id="bet-input" value="10" min="10">
                <button class="bet-btn" onclick="changeBet(50)">+</button>
            </div>

            <!-- Кнопка вызова панели -->
            <button class="quick-bet-toggle" onclick="toggleQuickBet()">
                ⬇️ Быстрые ставки
            </button>

            <!-- Выдвижная панель -->
            <div class="quick-bet-panel" id="quick-bet-panel">
                <div class="quick-bet-grid" id="quick-bet-grid">
                    <!-- Кнопки генерируются через JS -->
                </div>
                <div class="quick-bet-bottom">
                    <button class="quick-bet-control" onclick="changeQuickStep(-100)">-</button>
                    <button class="quick-bet-control" onclick="changeQuickStep(100)">+</button>
                </div>
            </div>
        </div>

        <!-- Рулетка -->
        <div class="roulette-container">
            <div class="pointer"></div>
            <div class="roulette-strip" id="strip"></div>
        </div>

        <p class="result-text" id="result"></p>

        <!-- Кнопка кручения -->
        <button class="spin-btn" id="spin-btn">Крутить</button>

    </main>

    <div class="toast" id="toast"></div>
    <audio id="spin-sound" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3" preload="auto"></audio>

    <script>
        // --- 1. ИНИЦИАЛИЗАЦИЯ TELEGRAM ---
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        Telegram.WebApp.disableVerticalSwipes();

        // --- 2. БАЗОВАЯ ЛОГИКА БАЛАНСА ---
        let balance = parseInt(localStorage.getItem('casino_balance')) || 1000;
        const balanceEl = document.getElementById('balance');
        balanceEl.innerText = balance;

        function updateBalance(amount) {
            balance += amount;
            if (balance < 0) balance = 0;
            localStorage.setItem('casino_balance', balance);
            balanceEl.innerText = balance;
            
            balanceEl.style.color = amount > 0 ? 'var(--money)' : 'var(--error)';
            setTimeout(() => { balanceEl.style.color = 'var(--money)'; }, 300);
        }

        function showToast(text) {
            const t = document.getElementById('toast');
            t.innerText = text;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        // --- 3. СИСТЕМА СТАВОК ---
        const betInput = document.getElementById('bet-input');
        let quickStep = 100; // Шаг изменения для быстрых ставок (100, 1000 и т.д.)
        
        // Функция для кнопок +/-
        function changeBet(amount) {
            let val = parseInt(betInput.value) + amount;
            if (val < 10) val = 10;
            if (val > balance) val = balance;
            betInput.value = val;
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        // Включение/выключение панели быстрых ставок
        function toggleQuickBet() {
            const panel = document.getElementById('quick-bet-panel');
            panel.classList.toggle('open');
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        // Генерация кнопок быстрых ставок
        function renderQuickBets() {
            const grid = document.getElementById('quick-bet-grid');
            grid.innerHTML = '';
            const values = [quickStep, quickStep * 2, quickStep * 5, quickStep * 10, quickStep * 50, quickStep * 100];
            
            values.forEach(val => {
                const btn = document.createElement('button');
                btn.className = 'quick-bet-btn';
                btn.innerText = val;
                btn.onclick = () => {
                    if (val > balance) {
                        betInput.value = balance;
                        showToast('Ставка равна балансу');
                    } else {
                        betInput.value = val;
                    }
                    Telegram.WebApp.HapticFeedback.impactOccurred('light');
                };
                grid.appendChild(btn);
            });
        }

        // Изменение шага быстрых ставок
        function changeQuickStep(amount) {
            quickStep += amount;
            if (quickStep < 10) quickStep = 10;
            renderQuickBets();
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        renderQuickBets(); // Отрисовываем при загрузке

        // --- 4. РУЛЕТКА ---
        const strip = document.getElementById('strip');
        const spinBtn = document.getElementById('spin-btn');
        const resultText = document.getElementById('result');
        const spinSound = document.getElementById('spin-sound');
        
        // Данные рулетки
        const items = [
            { name: 'Хлам', class: 'color: #64748b', mult: 1, chance: 50 },
            { name: 'Монета', class: 'color: #10b981', mult: 2, chance: 25 },
            { name: 'Кристалл', class: 'color: #0ea5e9', mult: 3, chance: 15 },
            { name: 'Артефакт', class: 'color: #8b5cf6', mult: 5, chance: 8 },
            { name: 'ДЖЕКПОТ', class: 'color: #f59e0b', mult: 10, chance: 2 }
        ];

        // Ширина одного квадратика рулетки (100px + 8px gap = 108px)
        const ITEM_WIDTH = 108; 

        // Генерация ленты
        function renderItems() {
            strip.innerHTML = '';
            for (let i = 0; i < 40; i++) {
                const item = items[i % items.length];
                const div = document.createElement('div');
                div.className = 'roulette-item';
                div.style.minWidth = '100px';
                div.style.height = '100px';
                div.style.display = 'flex';
                div.style.justifyContent = 'center';
                div.style.alignItems = 'center';
                div.style.borderRight = '1px solid rgba(255,255,255,0.1)';
                div.style.fontWeight = '900';
                div.style.fontSize = '14px';
                div.style.cssText += item.class; // Применяем цвет
                div.innerText = item.name;
                strip.appendChild(div);
            }
        }
        renderItems();

        // Механика кручения
        spinBtn.addEventListener('click', () => {
            const bet = parseInt(betInput.value);
            
            // Защита от нуля и дурака
            if (bet < 10) { showToast('Мин. ставка 10 ₽'); return; }
            if (bet > balance) { showToast('Недостаточно средств!'); return; }

            spinBtn.disabled = true;
            updateBalance(-bet); // Списываем ставку
            Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            
            // Включаем звук
            spinSound.currentTime = 0;
            spinSound.play().catch(e => {}); 

            // 1. Выбираем победителя по шансам
            const rand = Math.random() * 100;
            let acc = 0;
            let winIndex = 0;
            for (let i = 0; i < items.length; i++) {
                acc += items[i].chance;
                if (rand <= acc) { winIndex = i; break; }
            }

            // 2. Рассчитываем точную остановку
            //); Мы крутим на 5-6 // полных кругов вперед, чтобы а Снимация была долгой
            constере loops = 5 + Math.floor(Mathдина.random() * 2);
            // Индекс эк в ленте, нарана котором должна остановиться рулетка
            const мину targetIndex = (loops * itemsс.length) + winIndex;
            
            // Цент половирируем квадратик под стрелкой
на            const centerOffset = (window.innerWidth / 2) квадра - (100 / 2тика
            const shift = (targetIndex * ITEM_WIDTH) - centerOffset;

            // 3. Запускаем анимацию
            strip.style.transition = 'transform 4s cubic-bezier(0.1, 0.9, 0.2, 1)'; // 4 секунды плавного замедления
            strip.style.transform = `translateX(-${shift}px)`;

            // 4. Ждем окончания и показываем результат
            setTimeout(() => {
                const wonItem = items[winIndex];
                const winAmount = bet * wonItem.mult;
                
                if (wonItem.mult > 1) {
                    updateBalance(winAmount);
                    resultText.innerHTML = `<span style="color:var(--money)">${wonItem.name} (+${winAmount} ₽)</span>`;
                    Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                } else {
                    resultText.innerHTML = `<span style="color:var(--error)">${wonItem.name} (Проигрыш)</span>`;
                    Telegram.WebApp.HapticFeedback.notificationOccurred('error');
                }
                
                spinBtn.disabled = false;

                // Возвращаем ленту в исходное состояние через секунду
                setTimeout(() => {
                    strip.style.transition = 'none';
                    strip.style.transform = 'translateX(0)';
                }, 1000);

            }, 4100); // Ждем 4 секунды + 100мс запаса
        });
    </script>
</body>
</html>
