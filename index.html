<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Gearfe Casino</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap');
        :root {
            --bg: #0a0a0c; --surface: #16161a; --text: #fff; --hint: #888;
            --primary: #ff0055; --secondary: #7000ff; --money: #00e676; --gold: #ffd700;
            --r-common: #9e9e9e; --r-uncommon: #4caf50; --r-rare: #2196f3; --r-epic: #9c27b0; --r-legendary: #ff9800;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }
        
        .header { background: var(--surface); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 10; }
        .balance-box { display: flex; flex-direction: column; }
        .balance-label { font-size: 10px; color: var(--hint); text-transform: uppercase; }
        .balance { font-size: 22px; font-weight: 900; color: var(--money); }

        .screen { display: none; flex: 1; flex-direction: column; padding: 10px; overflow-y: auto; }
        .screen.active { display: flex; }

        /* Меню игр */
        .game-tabs { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; margin-bottom: 10px; scrollbar-width: none; }
        .game-tabs::-webkit-scrollbar { display: none; }
        .game-tab { padding: 10px 20px; background: var(--surface); border-radius: 20px; font-size: 12px; font-weight: 900; white-space: nowrap; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); color: var(--hint); transition: 0.2s; }
        .game-tab.active { background: linear-gradient(45deg, var(--primary), var(--secondary)); color: white; border-color: transparent; }

        /* Блок ставки */
        .bet-box { width: 100%; max-width: 340px; background: var(--surface); border-radius: 12px; padding: 15px; margin: 0 auto 15px auto; border: 1px solid rgba(255,255,255,0.05); text-align: center; z-index: 10; }
        .bet-box label { display: block; font-size: 12px; color: var(--hint); margin-bottom: 8px; font-weight: 800;}
        .bet-controls { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 5px; gap: 10px;}
        .bet-btn { width: 40px; height: 40px; border-radius: 8px; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 20px; font-weight: 900; cursor: pointer; flex-shrink: 0;}
        .bet-input { flex: 1; width: 100%; background: transparent; border: none; color: #fff; font-size: 24px; font-weight: 900; text-align: center; outline: none; }

        .game-container { display: none; flex-direction: column; align-items: center; width: 100%; flex: 1; justify-content: center;}
        .game-container.active { display: flex; }

        /* Кнопки */
        .btn { padding: 15px 30px; font-size: 16px; cursor: pointer; width: 100%; max-width: 300px; background: linear-gradient(45deg, var(--primary), var(--secondary)); color: white; border: none; border-radius: 12px; font-weight: 900; text-transform: uppercase; transition: 0.1s; margin-top: 10px;}
        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .btn-cashout { background: linear-gradient(45deg, var(--money), #00b359); }

        /* 1. Рулетка */
        .roulette-container { width: 100vw; overflow: hidden; position: relative; padding: 25px 0; background: linear-gradient(90deg, #000 0%, transparent 20%, transparent 80%, #000 100%); border-top: 1px solid rgba(255,255,255,0.1); border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        @keyframes bg-spin { 0% { transform: translateX(0); } 100% { transform: translateX(-500px); } }
        .roulette-strip { display: flex; gap: 10px; animation: bg-spin 10s linear infinite; }
        .roulette-strip.spinning { animation: none; transition: transform 3s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .r-item { min-width: 90px; height: 90px; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 12px; font-weight: 900; font-size: 12px; border: 2px solid; background: var(--surface); flex-shrink: 0; }
        .pointer { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; background: #fff; z-index: 10; transform: translateX(-50%); box-shadow: 0 0 20px #fff; }

        /* 2. Кости */
        .dice-container { display: flex; gap: 20px; margin-bottom: 20px; }
        .dice { width: 80px; height: 80px; background: #fff; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 40px; color: #000; font-weight: 900; }
        .dice.rolling { animation: shake 0.5s infinite; }
        @keyframes shake { 0% { transform: rotate(0deg); } 25% { transform: rotate(15deg); } 50% { transform: rotate(0deg); } 75% { transform: rotate(-15deg); } 100% { transform: rotate(0deg); } }

        /* 3. Мины */
        .mine-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 300px; }
        .mine-cell { width: 100%; aspect-ratio: 1; background: var(--surface); border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 30px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .mine-cell.safe { background: var(--money); color: #000; pointer-events: none; }
        .mine-cell.bomb { background: var(--primary); color: #fff; pointer-events: none; }
        .mine-multiplier { font-size: 24px; font-weight: 900; color: var(--gold); margin-bottom: 15px;}

        /* 4. Башня */
        .tower-container { display: flex; flex-direction: column-reverse; gap: 5px; width: 100%; max-width: 300px; margin-bottom: 20px; }
        .tower-row { display: flex; gap: 10px; width: 100%; }
        .tower-cell { flex: 1; height: 45px; background: var(--surface); border-radius: 8px; display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 14px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .tower-cell.safe { background: var(--money); color: #000; }
        .tower-cell.bomb { background: var(--primary); color: #fff; }
        .tower-cell:disabled { pointer-events: none; opacity: 0.5; }

        /* 5. Монетка */
        .coin-big { width: 150px; height: 150px; border-radius: 50%; background: linear-gradient(135deg, #ffd700, #ff8c00); display: flex; justify-content: center; align-items: center; font-size: 40px; font-weight: 900; color: #fff; cursor: pointer; margin-bottom: 30px; }
        .coin-big.spinning { animation: flip 3s ease-out forwards; }
        @keyframes flip { 0% { transform: rotateY(0) scale(1); } 50% { transform: rotateY(1800deg) scale(1.2); } 100% { transform: rotateY(3600deg) scale(1); } }

        /* 6. Колесо */
        .wheel-container { position: relative; width: 280px; height: 280px; margin-bottom: 20px; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; border: 4px solid var(--surface); transition: transform 4s cubic-bezier(0.1, 0.9, 0.2, 1); position: relative; overflow: hidden; background: conic-gradient(#ff0055 0deg 45deg, #7000ff 45deg 90deg, #00e676 90deg 135deg, #ffd700 135deg 180deg, #ff0055 180deg 225deg, #7000ff 225deg 270deg, #00e676 270deg 315deg, #ffd700 315deg 360deg); }
        .wheel-arrow { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid #fff; z-index: 10; }

        /* 7. Слоты */
        .slots-container { display: flex; gap: 10px; margin-bottom: 20px; background: var(--surface); padding: 20px; border-radius: 16px; }
        .slot { width: 70px; height: 90px; background: #000; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 40px; border: 2px solid rgba(255,255,255,0.1); }

        /* 8. Хай-Лоу */
        .card-area { display: flex; gap: 20px; margin-bottom: 20px; align-items: center;}
        .playing-card { width: 100px; height: 140px; background: #fff; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 40px; color: #000; font-weight: 900; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .hl-controls { display: flex; gap: 10px; width: 100%; max-width: 300px; }
        .hl-btn { flex: 1; padding: 15px; border-radius: 12px; border: none; font-weight: 900; font-size: 16px; color: #fff; cursor: pointer; }
        .btn-higher { background: var(--money); color: #000; }
        .btn-lower { background: var(--primary); }

        /* 9. Блэкджек */
        .bj-area { display: flex; gap: 10px; margin-bottom: 15px; }
        .bj-card { width: 60px; height: 90px; background: #fff; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 24px; color: #000; font-weight: 900; }
        .bj-controls { display: flex; gap: 10px; width: 100%; max-width: 300px; }

        /* 10. Угадай число */
        .guess-area { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; max-width: 300px;}
        .guess-btn { width: 50px; height: 50px; border-radius: 12px; border: none; background: var(--surface); color: #fff; font-size: 20px; font-weight: 900; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }

        /* Нижнее меню */
        .bottom-nav { display: flex; background: var(--surface); margin: 10px; border-radius: 50px; padding: 10px 20px; justify-content: space-around; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        .nav-btn { display: flex; flex-direction: column; align-items: center; color: var(--hint); font-size: 10px; font-weight: 800; cursor: pointer; padding: 8px 15px; border-radius: 30px; transition: 0.3s; }
        .nav-btn svg { width: 24px; height: 24px; fill: currentColor; margin-bottom: 4px; }
        .nav-btn.active { color: var(--text); background: rgba(255,255,255,0.1); }

        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
    </style>
</head>
<body>

    <div class="header">
        <div class="balance-box">
            <span class="balance-label">Баланс</span>
            <span class="balance" id="balance">0</span>
        </div>
    </div>

    <div id="screen-games" class="screen active">
        
        <!-- Меню игр -->
        <div class="game-tabs">
            <div class="game-tab active" onclick="switchGame('roulette', this)">🎰 Рулетка</div>
            <div class="game-tab" onclick="switchGame('dice', this)">🎲 Кости</div>
            <div class="game-tab" onclick="switchGame('mines', this)">💣 Мины</div>
            <div class="game-tab" onclick="switchGame('tower', this)">🏰 Башня</div>
            <div class="game-tab" onclick="switchGame('coin', this)">🪙 Монетка</div>
            <div class="game-tab" onclick="switchGame('wheel', this)">🎡 Колесо</div>
            <div class="game-tab" onclick="switchGame('slots', this)">🍒 Слоты</div>
            <div class="game-tab" onclick="switchGame('highlow', this)">🃏 Хай-Лоу</div>
            <div class="game-tab" onclick="switchGame('blackjack', this)">♠️ Блэкджек</div>
            <div class="game-tab" onclick="switchGame('guess', this)">🔢 Угадай число</div>
        </div>

        <!-- Блок ставки -->
        <div class="bet-box" id="universal-bet-box">
            <label>Ваша ставка (впиши число)</label>
            <div class="bet-controls">
                <button class="bet-btn" onclick="changeBet(-50)">-</button>
                <input type="number" class="bet-input" id="bet-input" value="10" min="10">
                <button class="bet-btn" onclick="changeBet(50)">+</button>
            </div>
        </div>

        <!-- ИГРА 1: РУЛЕТКА -->
        <div id="game-roulette" class="game-container active">
            <div class="roulette-container">
                <div class="pointer"></div>
                <div class="roulette-strip" id="strip"></div>
            </div>
            <p id="roulette-result" style="font-weight:900; height:30px; margin-bottom:10px;"></p>
            <button class="btn" id="spinBtn" onclick="spin()">Крутить</button>
        </div>

        <!-- ИГРА 2: КОСТИ -->
        <div id="game-dice" class="game-container">
            <div class="dice-container">
                <div class="dice" id="dice1">🎲</div>
                <div class="dice" id="dice2">🎲</div>
            </div>
            <p id="dice-result" style="font-weight:900; height:30px; margin-bottom:10px;"></p>
            <button class="btn" id="diceBtn" onclick="rollDice()">Бросить (7 или 11 = x2)</button>
        </div>

        <!-- ИГРА 3: МИНЫ -->
        <div id="game-mines" class="game-container">
            <div class="mine-multiplier" id="mine-mult" style="display: none;">x<span>1.0</span></div>
            <div class="mine-grid" id="mine-grid"></div>
            <button class="btn" id="mineBtn">Играть</button>
        </div>

        <!-- ИГРА 4: БАШНЯ -->
        <div id="game-tower" class="game-container">
            <div class="mine-multiplier" id="tower-mult" style="display: none;">x<span>1.0</span></div>
            <div class="tower-container" id="tower-grid"></div>
            <button class="btn" id="towerBtn">Начать</button>
        </div>

        <!-- ИГРА 5: МОНЕТКА -->
        <div id="game-coin" class="game-container">
            <div class="coin-big" id="coin" onclick="flipCoin()">?</div>
            <p id="coin-result" style="font-weight:900; height:30px;"></p>
        </div>

        <!-- ИГРА 6: КОЛЕСО -->
        <div id="game-wheel" class="game-container">
            <div class="wheel-container">
                <div class="wheel-arrow"></div>
                <div class="wheel" id="wheel"></div>
            </div>
            <p id="wheel-result" style="font-weight:900; height:30px;"></p>
            <button class="btn" id="wheelBtn" onclick="spinWheel()">Крутить</button>
        </div>

        <!-- ИГРА 7: СЛОТЫ -->
        <div id="game-slots" class="game-container">
            <div class="slots-container">
                <div class="slot" id="slot1">🍒</div>
                <div class="slot" id="slot2">🍒</div>
                <div class="slot" id="slot3">🍒</div>
            </div>
            <p id="slots-result" style="font-weight:900; height:30px;"></p>
            <button class="btn" id="slotsBtn" onclick="spinSlots()">Крутить (3 в ряд = x5)</button>
        </div>

        <!-- ИГРА 8: ХАЙ-ЛОУ -->
        <div id="game-highlow" class="game-container">
            <div class="card-area">
                <div class="playing-card" id="card-current">?</div>
            </div>
            <p id="hl-result" style="font-weight:900; height:30px; margin-bottom:10px;"></p>
            <div class="hl-controls" id="hl-buttons" style="display:none;">
                <button class="hl-btn btn-higher" onclick="guessHL('higher')">Больше</button>
                <button class="hl-btn btn-lower" onclick="guessHL('lower')">Меньше</button>
            </div>
            <button class="btn" id="hlBtn" onclick="startHighLow()">Начать</button>
        </div>

        <!-- ИГРА 9: БЛЭКДЖЕК -->
        <div id="game-blackjack" class="game-container">
            <div class="bj-area" id="bj-player-cards"></div>
            <p style="margin: 5px 0; font-size: 14px;">Очки: <span id="bj-score" style="font-weight:900; color:var(--gold)">0</span></p>
            <p id="bj-result" style="font-weight:900; height:30px; margin-bottom:10px;"></p>
            <div class="bj-controls" id="bj-actions" style="display:none;">
                <button class="btn" style="background:var(--surface)" onclick="bjHit()">Взять</button>
                <button class="btn" style="background:var(--money); color:#000;" onclick="bjStand()">Хватит</button>
            </div>
            <button class="btn" id="bjStartBtn" onclick="startBJ()">Раздать</button>
        </div>

        <!-- ИГРА 10: УГАДАЙ ЧИСЛО -->
        <div id="game-guess" class="game-container">
            <p style="font-weight:900; margin-bottom:20px; text-align:center;" id="guess-text">Я загадал число от 1 до 10</p>
            <div class="guess-area" id="guess-grid"></div>
            <p id="guess-result" style="font-weight:900; height:30px;"></p>
        </div>

    </div>

    <div class="bottom-nav">
        <div class="nav-btn active">
            <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 9 18.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg> Игры
        </div>
    </div>

    <canvas id="confettiCanvas"></canvas>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        Telegram.WebApp.setHeaderColor('#0a0a0c');
        Telegram.WebApp.disableVerticalSwipes();

        let balance = parseInt(localStorage.getItem('casino_balance')) || 1000;
        const balanceEl = document.getElementById('balance');
        const betInput = document.getElementById('bet-input');

        function updateBalance(amount) {
            balance += amount;
            localStorage.setItem('casino_balance', balance);
            balanceEl.innerText = balance;
            balanceEl.style.color = amount > 0 ? 'var(--money)' : 'var(--primary)';
            setTimeout(() => balanceEl.style.color = 'var(--money)', 500);
        }
        balanceEl.innerText = balance;

        betInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
            if(this.value > balance) this.value = balance;
        });

        function changeBet(amount) {
            let current = parseInt(betInput.value) || 0;
            let newVal = current + amount;
            if (newVal < 10) newVal = 10;
            if (newVal > balance) newVal = balance;
            betInput.value = newVal;
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        function placeBet() {
            const betAmount = parseInt(betInput.value) || 0;
            if (betAmount > balance) { Telegram.WebApp.showAlert('Недостаточно средств!'); return false; }
            if (betAmount < 10) { Telegram.WebApp.showAlert('Мин. ставка 10₽'); return false; }
            updateBalance(-betAmount);
            return betAmount;
        }

        function switchGame(gameId, btn) {
            document.querySelectorAll('.game-container').forEach(s => s.classList.remove('active'));
            document.getElementById('game-' + gameId).classList.add('active');
            document.querySelectorAll('.game-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if(gameId === 'coin' || gameId === 'wheel' || gameId === 'slots' || gameId === 'highlow' || gameId === 'blackjack') {
                document.getElementById('universal-bet-box').style.display = 'none';
            } else if (gameId === 'guess') {
                document.getElementById('universal-bet-box').style.display = 'none';
                initGuessGame();
            } else {
                document.getElementById('universal-bet-box').style.display = 'block';
            }
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        // ==========================================
        // 1. РУЛЕТКА
        // ==========================================
        const items = [
            { name: 'Хлам', class: 'r-common', mult: 1, chance: 50 },
            { name: 'Монета', class: 'r-uncommon', mult: 2, chance: 25 },
            { name: 'Кристалл', class: 'r-rare', mult: 3, chance: 15 },
            { name: 'Артефакт', class: 'r-epic', mult: 5, chance: 8 },
            { name: 'ДЖЕКПОТ', class: 'r-legendary', mult: 10, chance: 2 }
        ];
        const strip = document.getElementById('strip');
        const rouletteResult = document.getElementById('roulette-result');
        const spinBtn = document.getElementById('spinBtn');
        const ITEM_WIDTH = 100; 

        function renderItems() {
            strip.innerHTML = '';
            for (let i = 0; i < 30; i++) {
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = `r-item ${item.class}`;
                    div.innerHTML = `<div>${item.name}</div><div style="font-size:10px; margin-top:5px; color:${item.class==='r-common'?'var(--r-common)':item.class==='r-uncommon'?'var(--r-uncommon)':item.class==='r-rare'?'var(--r-rare)':item.class==='r-epic'?'var(--r-epic)':'var(--r-legendary)'}">x${item.mult}</div>`;
                    strip.appendChild(div);
                });
            }
        }

        function spin() {
            const bet = placeBet();
            if (!bet) return;
            spinBtn.disabled = true;
            rouletteResult.innerText = '';
            strip.classList.add('spinning');
            
            const rand = Math.random() * 100;
            let acc = 0;
            let winIndex = 0;
            for(let i=0; i<items.length; i++) {
                acc += items[i].chance;
                if(rand <= acc) { winIndex = i; break; }
            }

            strip.style.transition = 'transform 3s cubic-bezier(0.1, 0.9, 0.2, 1)'; 
            const loops = 5 + Math.floor(Math.random() * 3);
            const targetItemIndex = (loops * items.length) + winIndex;
            const centerOffset = window.innerWidth / 2;
            const itemCenter = (ITEM_WIDTH / 2);
            const shift = (targetItemIndex * ITEM_WIDTH) - centerOffset + itemCenter;

            strip.style.animation = 'none';
            strip.offsetHeight; 
            strip.style.transform = `translateX(-${shift}px)`;

            setTimeout(() => {
                const wonItem = items[winIndex];
                const winAmount = Math.floor(bet * wonItem.mult);
                
                if (wonItem.mult > 1) {
                    updateBalance(winAmount);
                    rouletteResult.innerHTML = `<span style="font-size:24px; color:var(--money)">${wonItem.name} (+${winAmount} ₽)</span>`;
                    fireConfetti(wonItem.mult * 20);
                    Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                } else {
                    rouletteResult.innerHTML = `<span style="font-size:24px; color:var(--primary)">${wonItem.name} (Проигрыш)</span>`;
                }
                spinBtn.disabled = false;
                setTimeout(() => {
                    strip.style.transition = 'none';
                    strip.style.transform = 'translateX(0)';
                    strip.classList.remove('spinning');
                }, 100);
            }, 3100); 
        }

        // ==========================================
        // 2. КОСТИ
        // ==========================================
        const dice1 = document.getElementById('dice1');
        const dice2 = document.getElementById('dice2');
        const diceResult = document.getElementById('dice-result');
        const diceBtn = document.getElementById('diceBtn');
        let diceRolling = false;

        function rollDice() {
            if (diceRolling) return;
            const bet = placeBet();
            if (!bet) return;
            diceRolling = true;
            diceBtn.disabled = true;
            diceResult.innerText = '';
            dice1.classList.add('rolling');
            dice2.classList.add('rolling');
            
            let count = 0;
            const interval = setInterval(() => {
                dice1.innerText = Math.floor(Math.random() * 6) + 1;
                dice2.innerText = Math.floor(Math.random() * 6) + 1;
                count++;
                if (count > 15) {
                    clearInterval(interval);
                    dice1.classList.remove('rolling');
                    dice2.classList.remove('rolling');
                    const val1 = Math.floor(Math.random() * 6) + 1;
                    const val2 = Math.floor(Math.random() * 6) + 1;
                    dice1.innerText = val1;
                    dice2.innerText = val2;
                    const sum = val1 + val2;
                    if (sum === 7 || sum === 11) {
                        const winAmount = bet * 2;
                        updateBalance(winAmount);
                        diceResult.innerHTML = `Сумма: ${sum} <br><span style="color:var(--money)">Победа! (+${winAmount} ₽)</span>`;
                        fireConfetti(80);
                        Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                    } else {
                        diceResult.innerHTML = `Сумма: ${sum} <br><span style="color:var(--primary)">Проигрыш</span>`;
                    }
                    diceRolling = false;
                    diceBtn.disabled = false;
                }
            }, 100);
        }

        // ==========================================
        // 3. МИНЫ
        // ==========================================
        const mineGrid = document.getElementById('mine-grid');
        const mineBtn = document.getElementById('mineBtn');
        const mineMult = document.getElementById('mine-mult');
        let mineGameActive = false;
        let bombs = [];
        let safeCells = 0;
        let currentMineBet = 0;
        const multipliers = [1.0, 1.5, 2.2, 3.5, 6.0, 12.0];

        function initMines() {
            mineGrid.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'mine-cell';
                cell.innerText = '❓';
                cell.onclick = () => clickMine(i, cell);
                mineGrid.appendChild(cell);
            }
        }

        function startMines() {
            if (mineGameActive) return;
            const bet = placeBet();
            if (!bet) return;
            currentMineBet = bet;
            mineGameActive = true;
            safeCells = 0;
            mineMult.style.display = 'block';
            mineMult.innerHTML = 'x<span>1.0</span>';
            mineBtn.innerText = 'Забрать';
            mineBtn.classList.add('btn-cashout');
            bombs = [];
            while(bombs.length < 3) {
                const r = Math.floor(Math.random() * 9);
                if(!bombs.includes(r)) bombs.push(r);
            }
            initMines();
        }

        function clickMine(index, cell) {
            if (!mineGameActive) return;
            if (cell.classList.contains('safe') || cell.classList.contains('bomb')) return;
            if (bombs.includes(index)) {
                cell.classList.add('bomb');
                cell.innerText = '💥';
                mineGameActive = false;
                mineBtn.innerText = 'Играть';
                mineBtn.classList.remove('btn-cashout');
                Telegram.WebApp.HapticFeedback.notificationOccurred('error');
                document.querySelectorAll('.mine-cell').forEach((c, i) => {
                    if(bombs.includes(i) && !c.classList.contains('bomb')) { c.innerText = '💣'; c.classList.add('bomb'); }
                });
            } else {
                cell.classList.add('safe');
                cell.innerText = '💎';
                safeCells++;
                const mult = multipliers[safeCells];
                mineMult.innerHTML = `x<span>${mult.toFixed(1)}</span>`;
                Telegram.WebApp.HapticFeedback.impactOccurred('light');
                if (safeCells === 6) cashoutMines();
            }
        }

        function cashoutMines() {
            if (!mineGameActive) return;
            mineGameActive = false;
            mineBtn.innerText = 'Играть';
            mineBtn.classList.remove('btn-cashout');
            if(safeCells > 0) {
                const winAmount = Math.floor(currentMineBet * multipliers[safeCells]);
                updateBalance(winAmount);
                Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                fireConfetti(150);
            }
        }
        mineBtn.onclick = function() { if (mineGameActive) cashoutMines(); else startMines(); };

        // ==========================================
        // 4. БАШНЯ (CRASH)
        // ==========================================
        const towerGrid = document.getElementById('tower-grid');
        const towerBtn = document.getElementById('towerBtn');
        const towerMult = document.getElementById('tower-mult');
        let towerGameActive = false;
        let towerLevel = 0;
        let towerBetAmount = 0;
        const towerMultipliers = [1.0, 1.3, 1.8, 2.5, 4.0, 6.5, 10.0];

        function initTower() {
            towerGrid.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                const row = document.createElement('div');
                row.className = 'tower-row';
                for(let j=0; j<2; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'tower-cell';
                    cell.innerText = '❓';
                    cell.onclick = () => clickTower(i, j, cell);
                    row.appendChild(cell);
                }
                towerGrid.appendChild(row);
            }
        }

        function startTower() {
            if (towerGameActive) return;
            const bet = placeBet();
            if (!bet) return;
            towerBetAmount = bet;
            towerGameActive = true;
            towerLevel = 0;
            towerMult.style.display = 'block';
            towerMult.innerHTML = 'x<span>1.0</span>';
            towerBtn.innerText = 'Забрать';
            towerBtn.classList.add('btn-cashout');
            initTower();
            // Включаем только нижний ряд
            document.querySelectorAll('.tower-row')[0].querySelectorAll('.tower-cell').forEach(c => c.disabled = false);
        }

        function clickTower(rowIndex, colIndex, cell) {
            if (!towerGameActive || rowIndex !== towerLevel) return;
            
            // 50% шанс на бомбу
            const isBomb = Math.random() < 0.4;
            if (isBomb) {
                cell.classList.add('bomb');
                cell.innerText = '💥';
                towerGameActive = false;
                towerBtn.innerText = 'Начать';
                towerBtn.classList.remove('btn-cashout');
                Telegram.WebApp.HapticFeedback.notificationOccurred('error');
                document.querySelectorAll('.tower-cell').forEach(c => c.disabled = true);
            } else {
                cell.classList.add('safe');
                cell.innerText = '💎';
                towerLevel++;
                towerMult.innerHTML = `x<span>${towerMultipliers[towerLevel].toFixed(1)}</span>`;
                Telegram.WebApp.HapticFeedback.impactOccurred('light');
                
                // Открываем следующий ряд
                if (towerLevel < 6) {
                    const nextRow = document.querySelectorAll('.tower-row')[towerLevel];
                    nextRow.querySelectorAll('.tower-cell').forEach(c => c.disabled = false);
                } else {
                    cashoutTower();
                }
            }
        }

        function cashoutTower() {
            if (!towerGameActive || towerLevel === 0) return;
            towerGameActive = false;
            towerBtn.innerText = 'Начать';
            towerBtn.classList.remove('btn-cashout');
            const winAmount = Math.floor(towerBetAmount * towerMultipliers[towerLevel]);
            updateBalance(winAmount);
            Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            fireConfetti(150);
            document.querySelectorAll('.tower-cell').forEach(c => c.disabled = true);
        }
        towerBtn.onclick = function() { if (towerGameActive) cashoutTower(); else startTower(); };

        // ==========================================
        // 5. МОНЕТКА
        // ==========================================
        const coin = document.getElementById('coin');
        const coinResult = document.getElementById('coin-result');
        let isFlipping = false;

        function flipCoin() {
            if (isFlipping) return;
            const bet = placeBet();
            if (!bet) return;
            isFlipping = true;
            coinResult.innerText = '';
            coin.innerText = '?';
            coin.classList.add('spinning');
            Telegram.WebApp.HapticFeedback.impactOccurred('medium');

            setTimeout(() => {
                const isHeads = Math.random() > 0.5;
                coin.innerText = isHeads ? 'ОРЁЛ' : 'РЕШКА';
                coin.classList.remove('spinning');
                const winAmount = bet * 2;
                updateBalance(winAmount);
                coinResult.innerText = `${isHeads ? 'Орёл' : 'Решка'}! (+${winAmount} ₽)`;
                isFlipping = false;
                Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                fireConfetti(80);
            }, 3000);
        }

        // ==========================================
        // 6. КОЛЕСО
        // ==========================================
        const wheel = document.getElementById('wheel');
        const wheelResult = document.getElementById('wheel-result');
        const wheelBtn = document.getElementById('wheelBtn');
        let wheelSpinning = false;
        let currentRotation = 0;

        function spinWheel() {
            if (wheelSpinning) return;
            const bet = placeBet();
            if (!bet) return;
            wheelSpinning = true;
            wheelBtn.disabled = true;
            wheelResult.innerText = '';

            const extraRotation = 360 * 5 + Math.random() * 360; // 5 кругов + рандом
            currentRotation += extraRotation;
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                // В зависимости от угла выдаем приз
                const normalizedAngle = currentRotation % 360;
                const winAmount = bet * 2; 
                updateBalance(winAmount);
                wheelResult.innerHTML = `Выигрыш: <span style="color:var(--money)">+${winAmount} ₽</span>`;
                wheelSpinning = false;
                wheelBtn.disabled = false;
                Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                fireConfetti(80);
            }, 4100);
        }

        // ==========================================
        // 7. СЛОТЫ
        // ==========================================
        const slot1 = document.getElementById('slot1');
        const slot2 = document.getElementById('slot2');
        const slot3 = document.getElementById('slot3');
        const slotsResult = document.getElementById('slots-result');
        const slotsBtn = document.getElementById('slotsBtn');
        let slotsSpinning = false;
        const slotItems = ['🍒', '🍋', '🍉', '💎', '7️⃣'];

        function spinSlots() {
            if (slotsSpinning) return;
            const bet = placeBet();
            if (!bet) return;
            slotsSpinning = true;
            slotsBtn.disabled = true;
            slotsResult.innerText = '';

            let count = 0;
            const interval = setInterval(() => {
                slot1.innerText = slotItems[Math.floor(Math.random() * slotItems.length)];
                slot2.innerText = slotItems[Math.floor(Math.random() * slotItems.length)];
                slot3.innerText = slotItems[Math.floor(Math.random() * slotItems.length)];
                count++;
                if (count > 15) {
                    clearInterval(interval);
                    checkSlots(bet);
                }
            }, 100);
        }

        function checkSlots(bet) {
            const val1 = slotItems[Math.floor(Math.random() * slotItems.length)];
            const val2 = slotItems[Math.floor(Math.random() * slotItems.length)];
            const val3 = slotItems[Math.floor(Math.random() * slotItems.length)];
            slot1.innerText = val1;
            slot2.innerText = val2;
            slot3.innerText = val3;

            if (val1 === val2 && val2 === val3) {
                const winAmount = bet * 5;
                updateBalance(winAmount);
                slotsResult.innerHTML = `ДЖЕКПОТ! <br><span style="color:var(--money)">+${winAmount} ₽</span>`;
                fireConfetti(150);
                Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            } else {
                slotsResult.innerHTML = `<span style="color:var(--primary)">Попробуй еще раз!</span>`;
            }
            slotsSpinning = false;
            slotsBtn.disabled = false;
        }

        // ==========================================
        // 8. ХАЙ-ЛОУ
        // ==========================================
        const cardCurrent = document.getElementById('card-current');
        const hlResult = document.getElementById('hl-result');
        const hlButtons = document.getElementById('hl-buttons');
        const hlBtn = document.getElementById('hlBtn');
        let hlActive = false;
        let currentCardVal = 0;
        let hlBetAmount = 0;

        function startHighLow() {
            if (hlActive) return;
            const bet = placeBet();
            if (!bet) return;
            hlBetAmount = bet;
            hlActive = true;
            hlBtn.style.display = 'none';
            hlButtons.style.display = 'flex';
            hlResult.innerText = '';
            
            currentCardVal = Math.floor(Math.random() * 10) + 2; // от 2 до 11
            cardCurrent.innerText = currentCardVal;
        }

        function guessHL(guess) {
            if (!hlActive) return;
            hlActive = false;
            hlButtons.style.display = 'none';
            hlBtn.style.display = 'block';
            
            const nextCardVal = Math.floor(Math.random() * 10) + 2;
            let win = false;
            
            if (guess === 'higher' && nextCardVal > currentCardVal) win = true;
            if (guess === 'lower' && nextCardVal < currentCardVal) win = true;

            setTimeout(() => {
                cardCurrent.innerText = nextCardVal;
                if (win) {
                    const winAmount = hlBetAmount * 2;
                    updateBalance(winAmount);
                    hlResult.innerHTML = `Следующая: ${nextCardVal}. Победа! (+${winAmount} ₽)`;
                    fireConfetti(80);
                    Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                } else {
                    hlResult.innerHTML = `Следующая: ${nextCardVal}. Проигрыш.`;
                }
            }, 500);
        }

        // ==========================================
        // 9. БЛЭКДЖЕК
        // ==========================================
        const bjPlayerCards = document.getElementById('bj-player-cards');
        const bjScoreEl = document.getElementById('bj-score');
        const bjResult = document.getElementById('bj-result');
        const bjActions = document.getElementById('bj-actions');
        const bjStartBtn = document.getElementById('bjStartBtn');
        let bjActive = false;
        let bjScore = 0;
        let bjBetAmount = 0;

        function startBJ() {
            if (bjActive) return;
            const bet = placeBet();
            if (!bet) return;
            bjBetAmount = bet;
            bjActive = true;
            bjScore = 0;
            bjPlayerCards.innerHTML = '';
            bjResult.innerText = '';
            bjStartBtn.style.display = 'none';
            bjActions.style.display = 'flex';
            
            bjHit();
            bjHit();
        }

        function bjHit() {
            if (!bjActive) return;
            const newCard = Math.floor(Math.random() * 9) + 2; // от 2 до 10
            bjScore += newCard;
            
            const cardDiv = document.createElement('div');
            cardDiv.className = 'bj-card';
            cardDiv.innerText = newCard;
            bjPlayerCards.appendChild(cardDiv);
            bjScoreEl.innerText = bjScore;

            if (bjScore > 21) {
                bjActive = false;
                bjActions.style.display = 'none';
                bjStartBtn.style.display = 'block';
                bjResult.innerHTML = `<span style="color:var(--primary)">Перебор! Проигрыш.</span>`;
            } else if (bjScore === 21) {
                bjStand();
            }
        }

        function bjStand() {
            if (!bjActive) return;
            bjActive = false;
            bjActions.style.display = 'none';
            bjStartBtn.style.display = 'block';

            if (bjScore >= 18) { // Компьютер набирает 18+
                const winAmount = bjBetAmount * 2;
                updateBalance(winAmount);
                bjResult.innerHTML = `<span style="color:var(--money)">Победа! (+${winAmount} ₽)</span>`;
                fireConfetti(80);
                Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            } else {
                bjResult.innerHTML = `<span style="color:var(--primary)">Дилер победил. Проигрыш.</span>`;
            }
        }

        // ==========================================
        // 10. УГАДАЙ ЧИСЛО
        // ==========================================
        const guessGrid = document.getElementById('guess-grid');
        const guessResult = document.getElementById('guess-result');
        const guessText = document.getElementById('guess-text');
        let secretNumber = 0;
        let guessActive = false;
        let guessBetAmount = 0;

        function initGuessGame() {
            guessGrid.innerHTML = '';
            guessResult.innerText = '';
            guessActive = false;
            guessText.innerText = 'Я загадал число от 1 до 10';
            for (let i = 1; i <= 10; i++) {
                const btn = document.createElement('button');
                btn.className = 'guess-btn';
                btn.innerText = i;
                btn.onclick = () => playGuess(i, btn);
                guessGrid.appendChild(btn);
            }
        }

        function playGuess(num, btn) {
            if (!guessActive) {
                // Делаем ставку только при первом клике
                const bet = placeBet();
                if (!bet) return;
                guessBetAmount = bet;
                guessActive = true;
                secretNumber = Math.floor(Math.random() * 10) + 1;
                guessText.innerText = 'Угадывай!';
            }

            if (num === secretNumber) {
                const winAmount = guessBetAmount * 5;
                updateBalance(winAmount);
                guessResult.innerHTML = `<span style="color:var(--money)">УГАДАЛ! Это было ${num}. (+${winAmount} ₽)</span>`;
                guessActive = false;
                guessText.innerText = 'Хочешь еще?';
                fireConfetti(150);
                Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            } else {
                btn.style.background = 'var(--primary)';
                btn.disabled = true;
                guessResult.innerHTML = `<span style="color:var(--primary)">Мимо! Это было ${secretNumber}.</span>`;
                guessActive = false;
                guessText.innerText = 'Не угадал. Нажми чтобы начать заново';
                setTimeout(() => initGuessGame(), 2000);
            }
        }

        // ==========================================
        // КОНФЕТТИ
        // ==========================================
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        function fireConfetti(count = 100) {
            const colors = ['#ff0055', '#7000ff', '#00ffcc', '#ffd700', '#00e676'];
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: window.innerWidth / 2, y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 25, vy: (Math.random() - 1) * 25,
                    size: Math.random() * 8 + 4, color: colors[Math.floor(Math.random() * colors.length)], life: 1
                });
            }
            requestAnimationFrame(updateConfetti);
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy; p.vy += 0.6; p.vx *= 0.96; p.life -= 0.015;
                if (p.life > 0) {
                    active = true; ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                }
            });
            ctx.globalAlpha = 1;
            if (active) requestAnimationFrame(updateConfetti);
        }

        // Запуск
        renderItems();
    </script>
</body>
</html>
