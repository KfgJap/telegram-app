<script>
'use strict';

Telegram.WebApp.ready();
Telegram.WebApp.expand();
Telegram.WebApp.disableVerticalSwipes();

const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============================================================
   SETTINGS
   ============================================================ */
const Settings = (() => {
  const KEY = 'casino_settings_v2';
  let data = { sound: true, haptic: true, anim: true, turbo: false };
  try { const saved = JSON.parse(localStorage.getItem(KEY)); if (saved) data = { ...data, ...saved }; } catch (e) {}
  function save() { localStorage.setItem(KEY, JSON.stringify(data)); }
  return {
    get sound() { return data.sound; },
    get haptic() { return data.haptic; },
    get anim() { return data.anim && !REDUCED_MOTION; },
    get turbo() { return data.turbo; },
    set sound(v) { data.sound = v; save(); },
    set haptic(v) { data.haptic = v; save(); },
    set anim(v) { data.anim = v; save(); },
    set turbo(v) { data.turbo = v; save(); }
  };
})();

function haptic(type = 'light') { if (!Settings.haptic) return; try { Telegram.WebApp.HapticFeedback.impactOccurred(type); } catch (e) {} }
function hapticNotify(type) { if (!Settings.haptic) return; try { Telegram.WebApp.HapticFeedback.notificationOccurred(type); } catch (e) {} }
function hapticSelect() { if (!Settings.haptic) return; try { Telegram.WebApp.HapticFeedback.selectionChanged(); } catch (e) {} }

/* ============================================================
   SOUND (Web Audio API — синтез, без внешних файлов)
   ============================================================ */
const Sound = (() => {
  let ctx = null;
  function getCtx() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    return ctx;
  }
  function tone(freq, dur, type = 'sine', vol = 0.1, delay = 0) {
    if (!Settings.sound) return;
    const c = getCtx();
    if (!c) return;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(c.destination);
    const t = c.currentTime + delay;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.start(t);
    osc.stop(t + dur);
  }
  return {
    click() { tone(600, 0.05, 'square', 0.05); },
    spin() {
      for (let i = 0; i < 8; i++) tone(400 + i * 50, 0.08, 'triangle', 0.04, i * 0.15);
    },
    win() { tone(523, 0.1); tone(659, 0.1, 'sine', 0.1, 0.1); tone(784, 0.2, 'sine', 0.1, 0.2); },
    lose() { tone(200, 0.3, 'sawtooth', 0.08); },
    jackpot() {
      for (let i = 0; i < 12; i++) tone(400 + i * 60, 0.1, 'sine', 0.08, i * 0.08);
    }
  };
})();

/* ============================================================
   WALLET
   ============================================================ */
const Wallet = (() => {
  const KEY = 'casino_balance_v6';
  const HIST_KEY = 'casino_history_v3';
  const STATS_KEY = 'casino_stats_v3';
  const START = 1000;
  const LOW_BALANCE_TOPUP = 100;

  let value = parseInt(localStorage.getItem(KEY));
  if (isNaN(value) || value < 0) value = START;
  let history = [];
  try { history = JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch (e) {}
  let stats = { spins: 0, won: 0, lost: 0, biggest: 0 };
  try { stats = { ...stats, ...JSON.parse(localStorage.getItem(STATS_KEY) || '{}') }; } catch (e) {}

  const el = document.getElementById('balance');
  const histListEl = document.getElementById('history-list');
  const statSpins = document.getElementById('stat-spins');
  const statWon = document.getElementById('stat-won');
  const statLost = document.getElementById('stat-lost');
  const statProfit = document.getElementById('stat-profit');
  const betMax = document.getElementById('bet-max');
  const userTitle = document.getElementById('user-title');

  function getTitle() {
    if (value >= 100000) return '💎 Легенда';
    if (value >= 50000) return '👑 Магнат';
    if (value >= 20000) return '🔥 Хайроллер';
    if (value >= 10000) return '💰 Богач';
    if (value >= 5000) return '⭐ Опытный';
    if (value >= 2000) return '🎲 Игрок';
    return '🌱 Новичок';
  }

  function renderBalance(animDir = null) {
    el.innerText = value;
    if (betMax) betMax.innerText = 'макс. ' + value;
    if (userTitle) userTitle.innerText = getTitle();
    if (animDir && Settings.anim) {
      el.classList.remove('flash-up', 'flash-down');
      void el.offsetWidth;
      el.classList.add(animDir === 'up' ? 'flash-up' : 'flash-down');
    }
  }

  function renderHistory() {
    if (!history.length) { histListEl.innerHTML = '<div class="history-empty">Пока пусто</div>'; return; }
    histListEl.innerHTML = '';
    history.slice(0, 20).forEach(h => {
      const row = document.createElement('div');
      row.className = 'history-row ' + (h.delta > 0 ? 'win' : 'lose');
      const sign = h.delta > 0 ? '+' : '';
      const time = new Date(h.ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      row.innerHTML = `<div class="left"><span class="game-name">${h.game}</span><span class="time">${time}</span></div><span class="delta">${sign}${h.delta} ₽</span>`;
      histListEl.appendChild(row);
    });
  }

  function renderStats() {
    statSpins.innerText = stats.spins;
    statWon.innerText = stats.won + ' ₽';
    statLost.innerText = stats.lost + ' ₽';
    const profit = stats.won - stats.lost;
    statProfit.innerText = (profit >= 0 ? '+' : '') + profit + ' ₽';
    statProfit.style.color = profit >= 0 ? 'var(--money)' : 'var(--error)';
  }

  function save() {
    localStorage.setItem(KEY, value);
    localStorage.setItem(HIST_KEY, JSON.stringify(history.slice(0, 100)));
    localStorage.setItem(STATS_KEY, JSON.stringify(stats));
  }

  function applyDeltaRaw(delta) {
    value = Math.max(0, value + Math.floor(delta));
    if (value === 0) value = LOW_BALANCE_TOPUP;
    return value;
  }

  return {
    get balance() { return value; },
    get stats() { return { ...stats }; },
    get history() { return [...history]; },
    render() { renderBalance(); renderHistory(); renderStats(); },
    applyDelta(delta) {
      applyDeltaRaw(delta);
      if (delta > 0) { stats.won += delta; if (delta > stats.biggest) stats.biggest = delta; }
      if (delta < 0) stats.lost += Math.abs(delta);
      save();
      renderBalance(delta > 0 ? 'up' : delta < 0 ? 'down' : null);
      renderStats();
    },
    recordBet({ game, bet, payout, delta }) {
      stats.spins += 1;
      history.unshift({ game, bet, payout, delta, ts: Date.now() });
      save();
      renderHistory();
      renderStats();
    },
    reset() {
      value = START;
      history = [];
      stats = { spins: 0, won: 0, lost: 0, biggest: 0 };
      save();
      this.render();
    }
  };
})();
Wallet.render();

/* ============================================================
   TOAST
   ============================================================ */
const Toast = (() => {
  const el = document.getElementById('toast');
  let timer = null;
  return {
    show(text, kind = '') {
      el.innerText = text;
      el.className = 'toast show' + (kind ? ' ' + kind : '');
      clearTimeout(timer);
      timer = setTimeout(() => { el.className = 'toast'; }, 2200);
      haptic();
    }
  };
})();

/* ============================================================
   RESULT MODAL
   ============================================================ */
const ResultModal = (() => {
  const modal = document.getElementById('result-modal');
  const card = document.getElementById('result-card');
  const label = document.getElementById('result-label');
  const amount = document.getElementById('result-amount');
  let timer = null;
  return {
    show({ label: l, amount: a, type }) {
      label.innerText = l;
      amount.innerText = a;
      card.className = 'result-card ' + type;
      modal.classList.add('show');
      clearTimeout(timer);
      timer = setTimeout(() => { modal.classList.remove('show'); }, type === 'jackpot' ? 2200 : 1400);
    },
    hide() { clearTimeout(timer); modal.classList.remove('show'); }
  };
})();

/* ============================================================
   BET
   ============================================================ */
const MIN_BET = 10;
const Bet = (() => {
  const input = document.getElementById('bet-input');
  const panel = document.getElementById('quick-panel');
  const grid = document.getElementById('quick-grid');
  let quickStep = 100;

  function clamp(v) {
    v = parseInt(v);
    if (isNaN(v)) v = MIN_BET;
    if (v < MIN_BET) v = MIN_BET;
    if (v > Wallet.balance) v = Wallet.balance || MIN_BET;
    return v;
  }
  function set(v) { input.value = clamp(v); }
  function renderQuick() {
    grid.innerHTML = '';
    [quickStep, quickStep*2, quickStep*5, quickStep*10, quickStep*50, quickStep*100].forEach(v => {
      const b = document.createElement('button');
      b.className = 'quick-btn';
      b.innerText = v;
      b.onclick = () => { set(v > Wallet.balance ? Wallet.balance : v); haptic(); };
      grid.appendChild(b);
    });
  }
  document.getElementById('bet-minus').onclick = () => { set(parseInt(input.value) - 50); haptic(); };
  document.getElementById('bet-plus').onclick = () => { set(parseInt(input.value) + 50); haptic(); };
  document.getElementById('quick-toggle').onclick = () => { panel.classList.toggle('open'); haptic(); };
  document.getElementById('step-minus').onclick = () => { quickStep = Math.max(10, quickStep - 100); renderQuick(); haptic(); };
  document.getElementById('step-plus').onclick = () => { quickStep += 100; renderQuick(); haptic(); };
  input.addEventListener('input', () => {
    const v = parseInt(input.value);
    if (isNaN(v)) return;
    if (v > Wallet.balance) { input.value = Wallet.balance; Toast.show('Максимум: ' + Wallet.balance); }
  });
  input.addEventListener('blur', () => set(input.value));
  renderQuick();
  return {
    get value() { return clamp(input.value); },
    validate() {
      const v = parseInt(input.value);
      if (isNaN(v) || v < MIN_BET) { Toast.show('Мин. ставка ' + MIN_BET + ' ₽', 'error'); return false; }
      if (v > Wallet.balance) { Toast.show('Недостаточно средств', 'error'); return false; }
      return true;
    },
    lock() { input.readOnly = true; },
    unlock() { input.readOnly = false; }
  };
})();

/* ============================================================
   GAMES
   ============================================================ */
const GAMES = [];
function registerGame(g) { GAMES.push(g); }

registerGame({
  id: 'roulette', name: 'Рулетка', icon: '🎰', enabled: true,
  cells: [
    { label: 'x0', mult: 0, chance: 42, color: '#64748b' },
    { label: 'x1.25', mult: 1.25, chance: 27, color: '#3b82f6' },
    { label: 'x1.5', mult: 1.5, chance: 16, color: '#8b5cf6' },
    { label: 'x2', mult: 2, chance: 9, color: '#10b981' },
    { label: 'x3', mult: 3, chance: 5, color: '#f97316' },
    { label: 'ДЖЕКПОТ', mult: 10, chance: 1, color: '#f59e0b', jackpot: true }
  ],
  totalCells: 60, itemW: 100, gap: 8,
  renderView(c) {
    c.innerHTML = `<div class="roulette-wrap" id="roulette-wrap"><div class="roulette-pointer"></div><div class="roulette-strip" id="roulette-strip"></div></div>`;
    const strip = c.querySelector('#roulette-strip');
    for (let i = 0; i < this.totalCells; i++) {
      const cell = this.cells[i % this.cells.length];
      const d = document.createElement('div');
      d.className = 'roulette-cell' + (cell.jackpot ? ' jackpot' : '');
      d.style.color = cell.color;
      d.innerText = cell.label;
      strip.appendChild(d);
    }
  },
  pickWinner() {
    const r = Math.random() * 100; let acc = 0;
    for (let i = 0; i < this.cells.length; i++) { acc += this.cells[i].chance; if (r < acc) return i; }
    return this.cells.length - 1;
  },
  async play(bet) {
    const wrap = document.getElementById('roulette-wrap');
    const strip = document.getElementById('roulette-strip');
    if (!wrap || !strip) throw new Error('view missing');
    const winIndex = this.pickWinner();
    const loops = Settings.turbo ? 2 : (Settings.anim ? 5 + Math.floor(Math.random() * 2) : 1);
    let target = loops * this.cells.length + winIndex;
    if (target >= this.totalCells) target = (this.totalCells - this.cells.length) + winIndex;
    const stride = this.itemW + this.gap;
    const centerOffset = (wrap.clientWidth / 2) - (this.itemW / 2) - 10;
    const shift = target * stride - centerOffset;
    strip.style.transition = 'none';
    strip.style.transform = 'translateX(0)';
    void strip.offsetWidth;
    const duration = Settings.turbo ? 1.5 : (Settings.anim ? 4 : 0.8);
    strip.style.transition = `transform ${duration}s cubic-bezier(0.1, 0.9, 0.2, 1)`;
    strip.style.transform = `translateX(-${shift}px)`;
    Sound.spin();
    await new Promise(r => setTimeout(r, duration * 1000 + 100));
    const won = this.cells[winIndex];
    const payout = Math.floor(bet * won.mult);
    setTimeout(() => { strip.style.transition = 'none'; strip.style.transform = 'translateX(0)'; }, 800);
    return { label: won.label, mult: won.mult, payout, delta: payout - bet, win: won.mult > 0, jackpot: !!won.jackpot };
  }
});

registerGame({
  id: 'dice', name: 'Кости', icon: '🎲', badge: 'hot', enabled: true,
  renderView(c) {
    c.innerHTML = `<div style="display:flex;justify-content:center;gap:16px;margin-bottom:12px;"><div class="roulette-cell" style="color:#fff;background:var(--surface);border-color:var(--primary);font-size:40px;width:80px;height:80px;border-radius:14px;" id="dice1">🎲</div><div class="roulette-cell" style="color:#fff;background:var(--surface);border-color:var(--primary);font-size:40px;width:80px;height:80px;border-radius:14px;" id="dice2">🎲</div></div><div style="text-align:center;font-size:11px;color:var(--hint);margin-bottom:12px;">Сумма 7 или 11 → x2</div>`;
  },
  async play(bet) {
    const d1 = document.getElementById('dice1');
    const d2 = document.getElementById('dice2');
    if (!d1 || !d2) throw new Error('view missing');
    Sound.spin();
    for (let i = 0; i < 10; i++) {
      d1.innerText = Math.floor(Math.random() * 6) + 1;
      d2.innerText = Math.floor(Math.random() * 6) + 1;
      await new Promise(r => setTimeout(r, Settings.turbo ? 40 : 80));
    }
    const v1 = Math.floor(Math.random() * 6) + 1;
    const v2 = Math.floor(Math.random() * 6) + 1;
    d1.innerText = v1; d2.innerText = v2;
    const sum = v1 + v2;
    const win = sum === 7 || sum === 11;
    const payout = win ? Math.floor(bet * 2) : 0;
    return { label: `Сумма ${sum}`, mult: win ? 2 : 0, payout, delta: payout - bet, win, jackpot: false };
  }
});

registerGame({
  id: 'slots', name: 'Слоты', icon: '🍒', badge: 'hot', enabled: true,
  symbols: ['🍒', '🍋', '🍉', '💎', '7️⃣', '⭐', '🔔'],
  tripleMult: { '🍒': 3, '🍋': 4, '🍉': 5, '💎': 8, '7️⃣': 12, '⭐': 20, '🔔': 6 },
  renderView(c) {
    c.innerHTML = `<div style="display:flex;justify-content:center;gap:10px;margin-bottom:12px;background:var(--surface);padding:16px;border-radius:14px;"><div class="roulette-cell" style="color:#fff;border-color:var(--primary);font-size:36px;width:70px;height:90px;" id="slot1">🍒</div><div class="roulette-cell" style="color:#fff;border-color:var(--primary);font-size:36px;width:70px;height:90px;" id="slot2">🍒</div><div class="roulette-cell" style="color:#fff;border-color:var(--primary);font-size:36px;width:70px;height:90px;" id="slot3">🍒</div></div><div style="text-align:center;font-size:11px;color:var(--hint);margin-bottom:12px;">3 в ряд = x3–x20</div>`;
  },
  async play(bet) {
    const s1 = document.getElementById('slot1');
    const s2 = document.getElementById('slot2');
    const s3 = document.getElementById('slot3');
    if (!s1 || !s2 || !s3) throw new Error('view missing');
    Sound.spin();
    for (let i = 0; i < (Settings.turbo ? 6 : 12); i++) {
      s1.innerText = this.symbols[Math.floor(Math.random() * this.symbols.length)];
      s2.innerText = this.symbols[Math.floor(Math.random() * this.symbols.length)];
      s3.innerText = this.symbols[Math.floor(Math.random() * this.symbols.length)];
      await new Promise(r => setTimeout(r, Settings.turbo ? 40 : 70));
    }
    const v1 = this.symbols[Math.floor(Math.random() * this.symbols.length)];
    const v2 = this.symbols[Math.floor(Math.random() * this.symbols.length)];
    const v3 = this.symbols[Math.floor(Math.random() * this.symbols.length)];
    s1.innerText = v1; s2.innerText = v2; s3.innerText = v3;
    let mult = 0, jackpot = false;
    if (v1 === v2 && v2 === v3) { mult = this.tripleMult[v1] || 3; jackpot = mult >= 12; }
    else if (v1 === v2 || v2 === v3 || v1 === v3) { mult = 1.5; }
    const payout = Math.floor(bet * mult);
    return { label: `${v1} ${v2} ${v3}`, mult, payout, delta: payout - bet, win: mult > 0, jackpot };
  }
});

registerGame({
  id: 'coin', name: 'Монетка', icon: '🪙', enabled: true, selected: 'heads',
  renderView(c) {
    c.innerHTML = `<div style="display:flex;gap:10px;margin-bottom:12px;"><button class="btn btn-sm" id="coin-heads" style="flex:1;background:var(--primary);">👑 Орёл</button><button class="btn btn-sm btn-ghost" id="coin-tails" style="flex:1;">🦅 Решка</button></div><div style="display:flex;justify-content:center;margin-bottom:12px;"><div class="roulette-cell" style="color:#000;background:radial-gradient(circle,#fbbf24,#d97706);border-color:#fff;font-size:48px;width:100px;height:100px;border-radius:50%;" id="coin">🪙</div></div><div style="text-align:center;font-size:11px;color:var(--hint);margin-bottom:12px;">Угадай сторону → x2</div>`;
    const self = this;
    const heads = c.querySelector('#coin-heads');
    const tails = c.querySelector('#coin-tails');
    heads.onclick = () => { self.selected = 'heads'; heads.style.background = 'var(--primary)'; heads.classList.remove('btn-ghost'); tails.style.background = 'transparent'; tails.classList.add('btn-ghost'); hapticSelect(); };
    tails.onclick = () => { self.selected = 'tails'; tails.style.background = 'var(--primary)'; tails.classList.remove('btn-ghost'); heads.style.background = 'transparent'; heads.classList.add('btn-ghost'); hapticSelect(); };
  },
  async play(bet) {
    const coin = document.getElementById('coin');
    if (!coin) throw new Error('view missing');
    Sound.spin();
    const dur = Settings.turbo ? 0.6 : 1.8;
    coin.style.transition = `transform ${dur}s ease-out`;
    coin.style.transform = 'rotateY(3600deg)';
    await new Promise(r => setTimeout(r, dur * 1000));
    coin.style.transition = 'none';
    coin.style.transform = 'rotateY(0)';
    const result = Math.random() < 0.5 ? 'heads' : 'tails';
    coin.innerText = result === 'heads' ? '👑' : '🦅';
    const win = result === this.selected;
    const payout = win ? Math.floor(bet * 2) : 0;
    return { label: result === 'heads' ? 'Орёл' : 'Решка', mult: win ? 2 : 0, payout, delta: payout - bet, win, jackpot: false };
  }
});

registerGame({
  id: 'crash', name: 'Краш', icon: '📈', badge: 'new', enabled: true,
  renderView(c) {
    c.innerHTML = `<div style="text-align:center;padding:20px;background:var(--surface);border-radius:14px;margin-bottom:12px;"><div style="font-family:'Oswald';font-size:52px;font-weight:900;color:var(--money);" id="crash-mult">1.00x</div><div style="font-size:11px;color:var(--hint);margin-top:4px;">Забери до краха!</div></div><div style="display:flex;gap:10px;margin-bottom:12px;"><button class="btn btn-sm" id="crash-cashout" style="flex:1;background:var(--money);" disabled>💰 Забрать</button></div>`;
  },
  async play(bet) {
    const multEl = document.getElementById('crash-mult');
    const cashoutBtn = document.getElementById('crash-cashout');
    if (!multEl || !cashoutBtn) throw new Error('view missing');
    const crashPoint = (() => { const r = Math.random(); return r < 0.97 ? Math.max(1, 0.97 / (1 - r)) : 20; })();
    let current = 1.0, cashed = false, cashedAt = 0;
    cashoutBtn.disabled = false;
    Sound.spin();
    cashoutBtn.onclick = () => {
      if (cashed) return;
      cashed = true; cashedAt = current;
      cashoutBtn.disabled = true;
      hapticNotify('success');
    };
    return new Promise(resolve => {
      const start = Date.now();
      const tick = setInterval(() => {
        const elapsed = (Date.now() - start) / 1000;
        current = +(1 + elapsed * (Settings.turbo ? 0.8 : 0.4)).toFixed(2);
        multEl.innerText = current.toFixed(2) + 'x';
        if (cashed) {
          clearInterval(tick);
          cashoutBtn.disabled = true;
          const payout = Math.floor(bet * cashedAt);
          setTimeout(() => resolve({ label: `Забрал на ${cashedAt.toFixed(2)}x`, mult: cashedAt, payout, delta: payout - bet, win: true, jackpot: false }), 300);
        } else if (current >= crashPoint) {
          clearInterval(tick);
          multEl.innerText = '💥 ' + crashPoint.toFixed(2) + 'x';
          cashoutBtn.disabled = true;
          setTimeout(() => resolve({ label: `Краш на ${crashPoint.toFixed(2)}x`, mult: 0, payout: 0, delta: -bet, win: false, jackpot: false }), 600);
        }
      }, 100);
    });
  }
});

registerGame({
  id: 'wheel', name: 'Колесо', icon: '🎡', badge: 'new', enabled: true,
  sectors: [
    { mult: 0, chance: 40, color: '#64748b', label: 'x0' },
    { mult: 1.5, chance: 25, color: '#3b82f6', label: 'x1.5' },
    { mult: 2, chance: 15, color: '#8b5cf6', label: 'x2' },
    { mult: 3, chance: 10, color: '#10b981', label: 'x3' },
    { mult: 5, chance: 7, color: '#f97316', label: 'x5' },
    { mult: 10, chance: 3, color: '#f59e0b', label: 'x10', jackpot: true }
  ],
  renderView(c) {
    const sectors = this.sectors.map(s => {
      const angle = (s.chance / 100) * 360;
      return `${s.color} 0deg ${angle}deg`;
    }).join(', ');

  },
  async play(bet) {

    const result = document.getElementById('wheel-result');
    if (!wheel || !result) throw new Error('view missing');
    Sound.spin();
    const r = Math.random() * 100; let acc = 0, winIdx = 0;
    for (let i = 0; i < this.sectors.length; i++) { acc += this.sectors[i].chance; if (r < acc) { winIdx = i; break; } }
    const won = this.sectors[winIdx];
    const targetAngle = (360 - (winIdx * (360 / this.sectors.length)) - 10);
    const totalSpin = (Settings.turbo ? 360 : 1440) + targetAngle;
    wheel.style.transform = `rotate(${totalSpin}deg)`;
    const dur = Settings.turbo ? 1.5 : 3;
    await new Promise(r => setTimeout(r, dur * 1000));
    result.innerText = won.label;
    result.style.color = won.color;
    const payout = Math.floor(bet * won.mult);
    return { label: won.label, mult: won.mult, payout, delta: payout - bet, win: won.mult > 0, jackpot: !!won.jackpot };
  }

const DailyBonus = (() => {
  const KEY = 'casino_bonus_v1';
  let last = parseInt(localStorage.getItem(KEY) || '0');
  const COOLDOWN = 24 * 60 * 60 * 1000;
  const AMOUNT = 500;
  function save() { localStorage.setItem(KEY, last); }
  function claim() {
    const now = Date.now();
    if (now - last < COOLDOWN) {
      const wait = Math.ceil((COOLDOWN - (now - last)) / (60 * 60 * 1000));
      Toast.show(`Бонус через ${wait} ч`, 'error');
      return;
    }
    last = now; save();
    Wallet.applyDelta(AMOUNT);
    Toast.show(`Бонус +${AMOUNT} ₽`, 'success');
    Sound.win();
    hapticNotify('success');
  }
  function canClaim() { return Date.now() - last >= COOLDOWN; }
  return { claim, canClaim };
})();

/* ============================================================
   ENGINE
   ============================================================ */
const Engine = (() => {
  let current = null, busy = false;
  const titleEl = document.getElementById('play-title');
  const iconEl = document.getElementById('play-icon');
  const viewEl = document.getElementById('game-view');
  const btn = document.getElementById('play-btn');

  const BTN_TEXT = {
    roulette: 'Крутить', dice: 'Бросить', slots: 'Крутить', coin: 'Подбросить',
    crash: 'Старт', wheel: 'Крутить', mines: 'Играть'
  };

  function select(gameId) {
    if (busy) return;
    const g = GAMES.find(x => x.id === gameId);
    if (!g || !g.enabled) return;
    current = g;
    titleEl.innerText = g.name;
    iconEl.innerText = g.icon;
    g.renderView(viewEl);
    btn.disabled = false;
    btn.innerText = BTN_TEXT[gameId] || 'Играть';
    Nav.show('play');
  }

  async function play() {
    if (busy || !current) return;
    if (!Bet.validate()) return;
    const bet = Bet.value;
    busy = true; btn.disabled = true; Bet.lock();
    haptic('medium');
    Wallet.applyDelta(-bet);
    Achievements.check('bet');
    try {
      const result = await current.play(bet);
      if (result) {
        if (result.win) Wallet.applyDelta(result.payout);
        Wallet.recordBet({ game: current.name, bet, payout: result.payout, delta: result.delta });
        const type = result.jackpot ? 'jackpot' : result.win ? 'win' : 'lose';
        ResultModal.show({
          label: result.jackpot ? '🎉 ДЖЕКПОТ' : result.label,
          amount: result.win ? `+${result.delta} ₽` : `−${bet} ₽`,
          type
        });
        if (result.jackpot) {
          Sound.jackpot();
          hapticNotify('warning');
          setTimeout(() => hapticNotify('success'), 200);
          setTimeout(() => hapticNotify('success'), 400);
          Achievements.check('jackpot');
        } else if (result.win) {
          Sound.win();
          hapticNotify('success');
          Achievements.check('win', { payout: result.payout });
          if (current.id === 'crash' && result.mult >= 5) Achievements.check('crash', { mult: result.mult });
        } else {
          Sound.lose();
          hapticNotify('error');
          Achievements.check('lose');
        }
        Achievements.check('spins', { count: Wallet.stats.spins });
        Achievements.check('games', { count: new Set(Wallet.history.map(h => h.game)).size });
        Leaderboard.record();
      }
    } catch (e) {
      Wallet.applyDelta(bet);
      Toast.show('Ошибка, ставка возвращена', 'error');
      console.error(e);
    } finally {
      busy = false; btn.disabled = false; Bet.unlock();
    }
  }

  btn.addEventListener('click', play);
  return { select, play, get busy() { return busy; } };
})();

    p += 15 + Math.random() * 20;
    if (p >= 100) {
      p = 100; fill.style.width = '100%';
      clearInterval(iv);
      setTimeout(() => loader.classList.add('hidden'), 300);
    } else fill.style.width = p + '%';
  }, 100);
})();
